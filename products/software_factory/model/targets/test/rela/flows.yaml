            - { to: fresh, when: "not (entity.answer == '') and not (entity.answer == 'none') and not (entity.answer == 'stronger') and not (entity.answer == 'abandon') and not (entity.answer == 'retry')" }
            - { to: stronger, when: "entity.answer == 'stronger'" }
            - { to: stuck, when: "entity.answer == 'abandon'" }
