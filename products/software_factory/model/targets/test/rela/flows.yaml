# Generated by atlas (mix model.gen) from products/software_factory/model/contract/compositions/atlas_eyra.ex, products/software_factory/model/contract/software/delivery.ex, products/software_factory/model/contract/software/pull_request.ex, products/software_factory/model/contract/software/pr_review.ex, products/software_factory/model/contract/software/pr_test.ex, products/software_factory/model/contract/eyra/use_case.ex, products/software_factory/model/contract/eyra/scene.ex, products/software_factory/model/contract/foundation/decision.ex, products/software_factory/model/contract/software/follow_through.ex, products/software_factory/model/contract/foundation/to_do.ex, products/software_factory/model/contract/software/package.ex. Do not edit: change the contract and regenerate.
flows:
  issue:
    label: Build
    subject: issue
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: working
    states:
      working:
        label: Working
        outputs:
          - set: { properties: { retry_step: author, task_failure: none } }
        on:
          change:
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      reviewing:
        label: Reviewing
        outputs:
          - set: { properties: { retry_step: review, task_failure: none } }
        on:
          change:
            - { to: publishing, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: publishing, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'changes_required'" }
            - { to: review_stuck, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: review_stuck, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      fixing:
        label: Fixing
        outputs:
          - set: { properties: { retry_step: fix, task_failure: none } }
        on:
          change:
            - { to: publishing, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: publishing, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      publishing:
        label: Opening its pull request
        outputs:
          - set: { properties: { ci_fixes: none, publication: none } }
        on:
          change:
            - { to: checking, roles: [atlas-flow], when: "entity.publication == 'done'" }
            - { to: unchanged, roles: [atlas-flow], when: "entity.publication == 'no_changes'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.publication == 'refused'" }
      checking:
        label: Waiting for CI
        outputs:
          - set: { properties: { pr_checks: pending, pr_mergeable: unknown } }
        on:
          change:
            - { to: done, when: "entity.pr_state == 'merged'" }
            - { to: update_failing, when: "(entity.pr_mergeable == 'conflicting' or entity.pr_mergeable == 'behind') and entity.pr_updates == 'one'" }
            - { to: updating, when: "entity.pr_mergeable == 'conflicting' or entity.pr_mergeable == 'behind'" }
            - { to: merging, when: "entity.pr_checks == 'success' and entity.pr_mergeable == 'clean'" }
            - { to: ci_failing, when: "entity.pr_checks == 'failure' and entity.ci_fixes == 'two'" }
            - { to: ci_fixing_again, when: "entity.pr_checks == 'failure' and entity.ci_fixes == 'one'" }
            - { to: ci_fixing, when: "entity.pr_checks == 'failure'" }
      updating:
        label: Updating it with develop
        outputs:
          - set: { properties: { pr_updates: one } }
        on:
          change:
            - { to: update_pushing, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: update_pushing, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: update_failing, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: update_failing, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      update_pushing:
        label: Pushing its update
        outputs:
          - set: { properties: { pr_update: none } }
        on:
          change:
            - { to: checking, roles: [atlas-flow], when: "entity.pr_update == 'done'" }
            - { to: update_failing, roles: [atlas-flow], when: "entity.pr_update == 'no_changes'" }
            - { to: update_failing, roles: [atlas-flow], when: "entity.pr_update == 'refused'" }
      update_failing:
        label: Conflicts with develop
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: done, when: "entity.gate_result == 'close'" }
            - { to: done, when: "entity.pr_state == 'merged'" }
            - { to: checking, when: "entity.pr_mergeable == 'clean'" }
      ci_fixing:
        label: Fixing its CI
        outputs:
          - set: { properties: { ci_fixes: one, retry_step: ci_fix, task_failure: none } }
        on:
          change:
            - { to: ci_pushing, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: ci_pushing, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      ci_fixing_again:
        label: Fixing its CI again
        outputs:
          - set: { properties: { ci_fixes: two, retry_step: ci_fix_again, task_failure: none } }
        on:
          change:
            - { to: ci_pushing, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: ci_pushing, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      ci_pushing:
        label: Pushing its CI fix
        outputs:
          - set: { properties: { ci_push: none } }
        on:
          change:
            - { to: checking, roles: [atlas-flow], when: "entity.ci_push == 'done'" }
            - { to: ci_failing, roles: [atlas-flow], when: "entity.ci_push == 'no_changes'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.ci_push == 'refused'" }
      ci_failing:
        label: CI still fails
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: done, when: "entity.gate_result == 'close'" }
            - { to: done, when: "entity.pr_state == 'merged'" }
            - { to: merging, when: "entity.pr_checks == 'success' and entity.pr_mergeable == 'clean'" }
      merging:
        label: Merge it
        outputs:
          - set: { properties: { pr_updates: none, ci_fixes: none } }
        on:
          change:
            - { to: done, when: "entity.pr_state == 'merged'" }
            - { to: checking, when: "entity.pr_mergeable == 'conflicting' or entity.pr_mergeable == 'behind'" }
            - { to: checking, when: "entity.pr_checks == 'failure' or entity.pr_checks == 'pending'" }
      unchanged:
        label: Nothing to merge
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: done, when: "entity.gate_result == 'close'" }
      stuck:
        label: Stuck
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: done, when: "entity.gate_result == 'close'" }
            - { to: done, when: "entity.pr_state == 'merged'" }
            - { to: reviewing, when: "entity.gate_result == 'retry' and entity.retry_step == 'review'" }
            - { to: fixing, when: "entity.gate_result == 'retry' and entity.retry_step == 'fix'" }
            - { to: ci_fixing, when: "entity.gate_result == 'retry' and entity.retry_step == 'ci_fix'" }
            - { to: ci_fixing_again, when: "entity.gate_result == 'retry' and entity.retry_step == 'ci_fix_again'" }
            - { to: working, when: "entity.gate_result == 'retry'" }
      review_stuck:
        label: Its review failed
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: done, when: "entity.gate_result == 'close'" }
            - { to: reviewing, when: "entity.gate_result == 'retry'" }
            - { to: publishing, when: "entity.gate_result == 'publish'" }
      done:
        label: Done
        final: true
  pull_request:
    label: Pull request
    subject: pull_request
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: checking
    states:
      checking:
        label: Review and test
        outputs:
          - set: { properties: { review_outcome: none, test_outcome: none, update: none } }
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.review_outcome == 'changes_requested'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.test_outcome == 'failed'" }
            - { to: integrating, roles: [atlas-flow], when: "entity.review_outcome == 'approved' and entity.test_outcome == 'passed'" }
      changes_requested:
        label: Changes requested
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: checking, when: "entity.update == 'updated'" }
      integrating:
        label: Integrate
        outputs:
          - set: { properties: { integration: none } }
        on:
          change:
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: checking, when: "entity.update == 'updated'" }
            - { to: integrated, roles: [atlas-flow], when: "entity.integration == 'done'" }
            - { to: blocked, roles: [atlas-flow], when: "entity.integration == 'refused'" }
      blocked:
        label: Integration blocked
        on:
          change:
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: integrating, when: "entity.integration == 'retry'" }
            - { to: checking, when: "entity.update == 'updated'" }
      integrated:
        label: Integrated
        final: true
      closed:
        label: Closed
        final: true
        status: cancelled
  pr_review:
    label: PR review
    subject: pr_review
    per_subject: one
    start:
      - on: create
    initial: working
    states:
      working:
        label: PR review in progress
        status: input_required
        waiting_for: [reviewer]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: approved, roles: [reviewer], when: "entity.verdict == 'approved'" }
            - { to: changes_requested, roles: [reviewer], when: "entity.verdict == 'changes_requested'" }
        after:
          stalled: { period: 3d, to: escalated, label: No outcome in three days }
      escalated:
        label: Escalated
        status: input_required
        waiting_for: [maintainer, reviewer]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: approved, roles: [maintainer, reviewer], when: "entity.verdict == 'approved'" }
            - { to: changes_requested, roles: [maintainer, reviewer], when: "entity.verdict == 'changes_requested'" }
      approved:
        final: true
      changes_requested:
        final: true
      superseded:
        label: Superseded by a newer PR revision
        final: true
        status: cancelled
  pr_test:
    label: PR test
    subject: pr_test
    per_subject: one
    start:
      - on: create
    initial: working
    states:
      working:
        label: PR test in progress
        status: input_required
        waiting_for: [tester]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: passed, roles: [tester], when: "entity.verdict == 'passed'" }
            - { to: failed, roles: [tester], when: "entity.verdict == 'failed'" }
        after:
          stalled: { period: 3d, to: escalated, label: No outcome in three days }
      escalated:
        label: Escalated
        status: input_required
        waiting_for: [maintainer, tester]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: passed, roles: [maintainer, tester], when: "entity.verdict == 'passed'" }
            - { to: failed, roles: [maintainer, tester], when: "entity.verdict == 'failed'" }
      passed:
        final: true
      failed:
        final: true
      superseded:
        label: Superseded by a newer PR revision
        final: true
        status: cancelled
  break_down_use_case:
    label: Plan
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.phase == 'break_down'"
    initial: break_down
    states:
      break_down:
        label: Break it down into issues
        on:
          change:
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      accepting:
        label: Accept it
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: broken_down, when: "entity.verdict == 'accept'" }
            - { to: break_down, when: "entity.verdict == 'reject'" }
      broken_down:
        label: Broken down
        final: true
        outputs:
          - set: { properties: { phase: accept } }
  accept_use_case:
    label: Accept the use case
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.phase == 'accept'"
    initial: building
    states:
      building:
        label: Build it
        on:
          change:
            - { to: breaking_down, roles: [atlas-flow], when: "entity.children == 0" }
            - { to: accepted, roles: [atlas-flow], when: "entity.children > 0 and entity.open_children == 0" }
      breaking_down:
        label: Being broken down
        outputs:
          - set: { properties: { phase: break_down } }
        on:
          change:
            - { to: building, when: "entity.phase == 'accept'" }
      accepted:
        label: Accepted
        final: true
        outputs:
          - set: { properties: { phase: accepted } }
  break_down_scene:
    label: Design
    subject: scene
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.phase == 'break_down'"
    initial: break_down
    states:
      break_down:
        label: Break it down into use cases
        on:
          change:
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'completed'" }
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'check_failed'" }
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'stuck'" }
            - { to: accepting, roles: [atlas-flow], when: "entity.task_result == 'abandoned'" }
      accepting:
        label: Accept it
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: broken_down, when: "entity.verdict == 'accept'" }
            - { to: break_down, when: "entity.verdict == 'reject'" }
      broken_down:
        label: Broken down
        final: true
        outputs:
          - set: { properties: { phase: accept } }
  accept_scene:
    label: Accept
    subject: scene
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.phase == 'accept'"
    initial: building
    states:
      building:
        label: Waiting for its use cases
        on:
          change:
            - { to: breaking_down, roles: [atlas-flow], when: "entity.children == 0" }
            - { to: to_accept, roles: [atlas-flow], when: "entity.open_children == 0" }
      breaking_down:
        label: Being broken down
        outputs:
          - set: { properties: { phase: break_down } }
        on:
          change:
            - { to: building, when: "entity.phase == 'accept'" }
      to_accept:
        label: Accept
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, when: "entity.verdict == 'accept'" }
            - { to: breaking_down, when: "entity.verdict == 'reject'" }
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      accepted:
        label: Accepted
        final: true
  decide:
    label: Decide
    subject: decision
    run_as: system:atlas-flow
    per_subject: one
    start:
      - on: create
    initial: deciding
    states:
      deciding:
        label: Who decides
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: for_person_always, roles: [atlas-flow], when: "entity.gate_result == 'person_always'" }
            - { to: for_person, roles: [atlas-flow], when: "entity.gate_result == 'person'" }
            - { to: for_agent, roles: [atlas-flow], when: "entity.gate_result == 'agent'" }
            - { to: for_agent_unverified, roles: [atlas-flow], when: "entity.gate_result == 'agent_unverified'" }
      for_person_always:
        label: A person decides
        status: input_required
        waiting_for: [principle_authority, decider]
        on:
          change:
            - { to: accepted, roles: [principle_authority, decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [principle_authority, decider], when: "entity.status == 'rejected'" }
      for_person:
        label: Waiting for a person
        status: input_required
        waiting_for: [decider]
        on:
          change:
            - { to: accepted, roles: [decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [decider], when: "entity.status == 'rejected'" }
        after:
          no_answer: { period: 5m, to: deciding }
      for_agent:
        label: An agent may decide
        status: input_required
        waiting_for: [delegate, decider]
        on:
          change:
            - { to: accepted, roles: [delegate, decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [delegate, decider], when: "entity.status == 'rejected'" }
      for_agent_unverified:
        label: Unverified agent decision
        status: input_required
        waiting_for: [delegate, decider]
        outputs:
          - set: { properties: { unverified: true } }
        on:
          change:
            - { to: accepted, roles: [delegate, decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [delegate, decider], when: "entity.status == 'rejected'" }
      accepted:
        label: Accepted
        final: true
      rejected:
        label: Rejected
        final: true
  follow_through:
    label: Follow through
    subject: decision
    per_subject: one
    start:
      - on: predicate
        when: "entity.status == 'accepted'"
    initial: waiting
    states:
      waiting:
        label: Carry it out
        on:
          change:
            - { to: no_work, when: "entity.no_work == true" }
            - { to: superseded, when: "entity.status == 'superseded'" }
            - { to: carried_out, when: "entity.work > 0" }
      carried_out:
        label: Carried out
        final: true
      no_work:
        label: No work needed
        final: true
      superseded:
        label: Superseded
        final: true
        status: cancelled
  to_do:
    label: To-Do
    subject: to_do
    per_subject: one
    start:
      - on: create
    initial: open
    states:
      open:
        label: To do
        status: input_required
        waiting_for: [assignee]
        on:
          change:
            - { to: done, roles: [assignee], when: "entity.status == 'done'" }
            - { to: wont_do, roles: [assignee], when: "entity.status == 'wont_do'" }
      done:
        label: Done
        final: true
      wont_do:
        label: Won't do
        final: true
  package:
    label: Package
    subject: package
    run_as: system:atlas-flow
    per_subject: one
    start:
      - on: create
    initial: waiting
    states:
      waiting:
        label: Waiting
        on:
          change:
            - { to: authoring, when: "not (entity.instructions == '')" }
      authoring:
        label: Authoring
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      reviewing:
        label: Reviewing
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      fixing:
        label: Fixing
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      diagnosing:
        label: Diagnosing
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
