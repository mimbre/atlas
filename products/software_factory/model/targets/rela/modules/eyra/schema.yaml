# Complete definitions; included paths are relative to the selected root.
types:
  plan_status:
    values:
    - refine
    - ready_to_pick_up
    labels:
      refine: Refine
      ready_to_pick_up: Ready to pick up
    descriptions:
      refine: Being written and negotiated; not ready to build from.
      ready_to_pick_up: Agreed; the next level can be derived and built.
  pipeline_phase:
    values:
    - break_down
    - accept
    - accepted
    labels:
      break_down: Break down
      accept: Accept
      accepted: Accepted
    descriptions:
      break_down: 'Its break-down flow has it: it is broken down into what builds it.'
      accept: 'Its acceptance flow has it: what is under it is built, then it is accepted.'
      accepted: Its acceptance flow accepted it.
entities:
  scene:
    label: Scene
    plural: scenes
    aliases:
    - sc
    id_type: manual
    id_prefix: SC-
    description: |
      An actor-centred view of the system, with one angle and one zoom level
      (Flux's meaning). The id is its code, e.g. SC-Atlas-01.
    properties:
      title:
        type: string
        required: true
        description: 'Without the code (Flux: name)'
      description:
        type: string
        description: 'The text (Flux: description)'
      flux_id:
        type: string
        unique: true
        description: Flux (Basecamp) id, set by a later Flux sync
      status:
        type: plan_status
        description: Flux group; empty = no group
      phase:
        type: pipeline_phase
        description: 'Flow: which flow of its pipeline has it (break down, accept)'
      note:
        type: string
        description: Its producer's note when it was not accepted; its next break-down reads it
      children:
        type: integer
        description: 'Flow: how many use cases are in it'
      open_children:
        type: integer
        description: 'Flow: how many of them are not finished'
      verdict:
        type: string
        description: 'Flow: the acceptor''s verdict (none, accept, reject), or its supervisor''s acceptance of its use cases (accept)'
      task_result:
        type: string
        description: 'Flow: how its break-down''s agent task ended (completed, check_failed, stuck, abandoned); the run''s own, never written'
      pass_result:
        type: string
        description: 'Flow: how the last pass ended (none, delivered, failed)'
  use_case:
    label: Use case
    plural: use_cases
    aliases:
    - uc
    id_type: manual
    id_prefix: UC-
    description: |
      The technical contract for part of a scene (Flux's meaning). The id is
      its code, e.g. UC-Atlas-01.
    properties:
      title:
        type: string
        required: true
        description: 'Without the code (Flux: name)'
      description:
        type: string
        description: 'The text (Flux: description)'
      flux_id:
        type: string
        unique: true
        description: Flux (Basecamp) id, set by a later Flux sync
      status:
        type: plan_status
        description: Flux group; empty = no group
      design:
        type: string
        description: 'The Design part: how it is built, proposed with it by its scene''s break-down and accepted by its supervisor'
      note:
        type: string
        description: 'Its proposer''s note: an architecture choice it needs that is not decided, said instead of decided'
      phase:
        type: pipeline_phase
        description: 'Flow: which flow of its pipeline has it (break down, accept, accepted)'
      children:
        type: integer
        description: 'Flow: how many issues are in it'
      open_children:
        type: integer
        description: 'Flow: how many of them are not finished'
      verdict:
        type: string
        description: 'Flow: the acceptor''s verdict (none, accept, reject), or its supervisor''s acceptance of its issues (accept)'
      task_result:
        type: string
        description: 'Flow: how its break-down''s agent task ended (completed, check_failed, stuck, abandoned); the run''s own, never written'
      pass_result:
        type: string
        description: 'Flow: how the last pass ended (none, delivered, failed)'
      gate_result:
        type: string
        description: 'Flow: the last design gate verdict, or a maintainer''s choice (none, review, rework, ready, person, close)'
relations:
  accepted_by:
    label: accepted by
    description: Who accepted a scene, after testing it; at most one.
    from:
    - scene
    to:
    - person
    max_outgoing: 1
    inverse:
      id: accepted
      label: accepted
  in_scene:
    label: in scene
    description: A use case belongs to at most one scene (Flux); a scene has zero or more use cases.
    from:
    - use_case
    to:
    - scene
    max_outgoing: 1
    inverse:
      id: use_cases
      label: use cases
  in_use_case:
    label: in use case
    description: An issue belongs to at most one use case (Flux); a use case has zero or more issues.
    from:
    - issue
    to:
    - use_case
    max_outgoing: 1
    inverse:
      id: issues
      label: issues
