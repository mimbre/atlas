# Software: Package, a bounded part of an issue that becomes one pull request (F1.4),
# authored, reviewed and fixed as the review → fix loop says (F2-P). It waits for its
# instructions; then each task (author, review, fix, diagnose, a fresh or a stronger
# author) runs on the machinery its Assignment names, and its end leads where the
# ladder's next step says: ready, held, awaiting a decision, or another task. Held and
# awaiting a decision reset the answer to none, and go on as their supervisor answers: fresh (or
# a worded option), stronger, abandon (stuck), or retry (held after an abandoned
# task: back to that task's step, as Flow wrote it in retry_step). A ready package
# may be abandoned. An answer while a task runs on the recommended default (rung (e),
# safe to continue) cancels that task and is followed: abandon to stuck.
flows:
  package:
    label: Package
    subject: package
    run_as: system:atlas-flow
    per_subject: one
    start:
      - on: create
    initial: waiting
    states:
      waiting:
        label: Waiting
        on:
          change:
            - { to: authoring, when: "not (entity.instructions == '')" }
      authoring:
        label: Authoring
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      reviewing:
        label: Reviewing
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      fixing:
        label: Fixing
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      diagnosing:
        label: Diagnosing
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      fresh:
        label: Authoring afresh
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      stronger:
        label: Authoring stronger
        on:
          change:
            - { to: authoring, roles: [atlas-flow], when: "entity.task_result == 'author'" }
            - { to: reviewing, roles: [atlas-flow], when: "entity.task_result == 'review'" }
            - { to: fixing, roles: [atlas-flow], when: "entity.task_result == 'fix'" }
            - { to: diagnosing, roles: [atlas-flow], when: "entity.task_result == 'diagnose'" }
            - { to: fresh, roles: [atlas-flow], when: "entity.task_result == 'fresh'" }
            - { to: stronger, roles: [atlas-flow], when: "entity.task_result == 'stronger'" }
            - { to: ready, roles: [atlas-flow], when: "entity.task_result == 'ready'" }
            - { to: held, roles: [atlas-flow], when: "entity.task_result == 'held'" }
            - { to: awaiting_decision, roles: [atlas-flow], when: "entity.task_result == 'escalate'" }
            - { to: stuck, roles: [atlas-flow], when: "entity.task_result == 'abandon'" }
      ready:
        label: Ready
        on:
          change:
            - { to: stuck, when: "entity.answer == 'abandon'" }
      held:
        label: Held
        outputs:
          - set: { properties: { answer: none } }
        on:
          change:
            - { to: fresh, when: "not (entity.answer == '') and not (entity.answer == 'none') and not (entity.answer == 'stronger') and not (entity.answer == 'abandon') and not (entity.answer == 'retry')" }
            - { to: stronger, when: "entity.answer == 'stronger'" }
            - { to: stuck, when: "entity.answer == 'abandon'" }
            - { to: authoring, when: "entity.answer == 'retry' and entity.retry_step == 'author'" }
            - { to: reviewing, when: "entity.answer == 'retry' and entity.retry_step == 'review'" }
            - { to: fixing, when: "entity.answer == 'retry' and entity.retry_step == 'fix'" }
            - { to: diagnosing, when: "entity.answer == 'retry' and entity.retry_step == 'diagnose'" }
            - { to: fresh, when: "entity.answer == 'retry' and entity.retry_step == 'fresh'" }
            - { to: stronger, when: "entity.answer == 'retry' and entity.retry_step == 'stronger'" }
      awaiting_decision:
        label: Awaiting a decision
        outputs:
          - set: { properties: { answer: none } }
        on:
          change:
            - { to: fresh, when: "not (entity.answer == '') and not (entity.answer == 'none') and not (entity.answer == 'stronger') and not (entity.answer == 'abandon') and not (entity.answer == 'retry')" }
            - { to: stronger, when: "entity.answer == 'stronger'" }
            - { to: stuck, when: "entity.answer == 'abandon'" }
      stuck:
        label: Stuck
        final: true
