# CI tests a tree once (docs/guides/prod.md, "CI tests a tree once"). Job tested-tree
# computes this run's git tree and base key (the blob of CI_BASE_FILE at CI_BASE). On a push
# to develop or master, and on a pull request into master, it looks for the records of
# successful runs of this workflow (artifacts tested-tree-<tree> and
# tested-base-<tree>-<base key>, tools/ci/tested-tree.mjs). With the first, the test jobs
# are skipped; with both, the base job too. The deploys still run.
#
# A new test job joins the scheme with these two lines:
#     needs: tested-tree
#     if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
# and its id in record-tested-tree's needs (and in a deploy's needs when that deploy waits
# for it). A job whose result depends on the base as well as the tree is a base job instead:
#     if: ${{ !cancelled() && needs.tested-tree.outputs.base_tested != 'true' }}
# and its id in record-tested-base's needs. Exempt from both: tested-tree, the two record
# jobs (they keep the implicit success() condition), and every job named deploy-*, which
# needs tested-tree and keeps the four clauses of its if (no failure, no cancel, skipped
# only when tested). tested-tree runs tools/ci/tested-tree.mjs check-workflow on this file:
# CI fails while a job is outside the scheme, so nothing is recorded without that job.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

# The base a base job checks against: a pull request's base branch, or a push's branch as it
# was before the push.
env:
  CI_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  CI_BASE_FILE: model/targets/proof/digests.json

jobs:
  tested-tree:
    name: Tree tested before?
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tree: ${{ steps.find.outputs.tree }}
      base_key: ${{ steps.find.outputs.base_key }}
      tested: ${{ steps.find.outputs.tested }}
      run_id: ${{ steps.find.outputs.run_id }}
      base_tested: ${{ steps.find.outputs.base_tested }}
      base_run_id: ${{ steps.find.outputs.base_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit, for the base key.
          fetch-depth: 0
      - name: Every job is in the scheme, and the lookup's own tests pass
        run: |
          node tools/ci/tested-tree.mjs check-workflow .github/workflows/ci.yml
          node --test tools/ci/tested-tree.test.mjs
      # Neither step fails: without a trusted record everything runs.
      - name: This tree and base key
        id: keys
        run: node tools/ci/tested-tree.mjs keys
      - name: Look for the records of this tree
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TREE: ${{ steps.keys.outputs.tree }}
          BASE_KEY: ${{ steps.keys.outputs.base_key }}
        run: node tools/ci/tested-tree.mjs find

  generator:
    name: Spec generator on its own
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: bff/generator
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - name: The generator holds none of Atlas's values
        run: |
          if grep -rniE 'AtlasBFFContract|AtlasControl|AtlasTui|AtlasAgent|scene|use_case|turn_outcome|submit_to|cancel_to|confirm_to|\.\./contract|bff/contract|"0\.2\.0"' lib test mix.exs; then
            echo "::error::bff/generator mentions Atlas's contract. Keep Atlas's values in bff/contract."
            exit 1
          fi
      # Compiled and tested without bff/contract, on a neutral example contract.
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors

  contract:
    name: Contract and its file targets
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff/contract
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # Fails when a file in bff/targets differs from what the contract generates, or is left over.
      - run: mix atlas.gen --check
      - run: mix test
      # tools/tests build atlas-runtime from tools/runtime for its node commands.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      # tools/tests read the contract compiled above (bff/contract/_build).
      - run: python3 -m unittest discover -s tools/tests -v
        working-directory: .

  model-dsl:
    name: Rela DSL on its own
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: model/dsl
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - name: The DSL holds none of Atlas's flows
        run: |
          if grep -rnE '(^|[^.[:alnum:]_])Model\.[A-Z{]|:model\b' lib test mix.exs || grep -rniE '\.\./contract|model/contract|\bissue\b|pull_request|pr_review|pr_test|use_case|\bscene\b|\bdecision\b|delivery_evidence' lib test mix.exs; then
            echo "::error::model/dsl mentions Atlas's flows. Keep them in model/contract."
            exit 1
          fi
      # Compiled and tested without model/contract, on a neutral example contract.
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors

  model-contract:
    name: The model and its file targets
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      # The pinned rela: --check validates flows.yaml with it and redraws the diagrams,
      # and the contract's :rela tests run.
      ATLAS_RELA_BIN: ${{ github.workspace }}/.rela-bin
    defaults:
      run:
        working-directory: model/contract
    steps:
      - uses: actions/checkout@v4
      # The model names roles, never people (D-0083, slice 7): an owner is {kind, config:
      # role}, and each environment's settings say who fills the role (`actors`).
      - name: The model names no person
        run: |
          if grep -rnE --exclude-dir=_build --exclude-dir=deps '\{ *:person *, *[:"]|kind: *:person *, *key:|key: *"[^"]*" *, *kind: *:person|"kind" *(=>|:) *"person" *, *"key"|"key" *(=>|:) *"[^"]*" *, *"kind" *(=>|:) *"person"' .; then
            echo "::error::model/contract names a person. Name a configured role instead: {:person, config: :decider}, and the person in the environment's actors."
            exit 1
          fi
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      # rela, pinned in rela/scripts/start-test.sh; it downloads it when missing.
      - uses: actions/cache@v4
        with:
          path: .rela-bin
          key: rela-26.11.2-linux_amd64
      - run: rela/scripts/start-test.sh install
        working-directory: .
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # Fails when a file of the Rela project (rela/) or of model/targets differs from what
      # the model generates, is missing or left over, or when rela refuses the generated
      # description. The run identities against the base: job model-base.
      - run: mix model.gen --check
      - run: mix test

  # A base job: its result depends on the tree and on the base's digests.json, so it is
  # recorded per base key and skipped only when this tree passed against the same file.
  model-base:
    name: The model's run identities against the base
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.base_tested != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.keys.outputs.tree }}
      base_key: ${{ steps.keys.outputs.base_key }}
      base_commit: ${{ steps.keys.outputs.base_commit }}
    defaults:
      run:
        working-directory: model/contract
    steps:
      - uses: actions/checkout@v4
        with:
          # --base reads the base's digests.json.
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - name: This tree and base key
        id: keys
        run: node tools/ci/tested-tree.mjs keys
        working-directory: .
      # Fails when a subflow's run identity changed without a migration the base can
      # approve (its digests.json). record-tested-base keys its record on what this job checked.
      - name: The run identities against the base
        env:
          BASE: ${{ steps.keys.outputs.base_commit }}
        run: |
          [ -n "$BASE" ] || { echo "::error::The base $CI_BASE is no commit of this repository"; exit 1; }
          mix model.gen --check --base "$BASE"

  beam:
    name: Bus, Facts, Control
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: beam
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - run: go -C ../tools/runtime test ./...
      - run: python3 -m pip install -r ../rela/scripts/requirements.txt
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --include integration
      # A submit through Control waits until Flow settled past it (docs/design/page-freshness.md
      # §2.2), on Facts, Flow and a Control session over the Bus; ExUnit exits non-zero on a failure.
      - run: mix run integration/settle_submit.exs

  tui:
    name: TUI
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: clients/tui
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  agent:
    name: Agents' command line and migration
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors && mix format --check-formatted && mix test
        working-directory: clients/agent
      - run: mix compile --warnings-as-errors && mix format --check-formatted && mix test
        working-directory: transport
      # The one-off migration (atlas migrate-done-owner) compiles the client too.
      - run: mix compile --warnings-as-errors && mix format --check-formatted && mix test
        working-directory: tools/plan

  e2e:
    name: End to end (rela, core, two TUIs)
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
      ATLAS_E2E_RELA_BIN: ${{ github.workspace }}/.rela-bin
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      # integration/worker_control.exs builds the atlas-runtime native host from tools/runtime.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - run: python3 -m pip install -r rela/scripts/requirements.txt
      - run: ATLAS_RELA_BIN="$ATLAS_E2E_RELA_BIN" rela/scripts/start-test.sh install
      - run: python3 -m unittest discover -s rela/tests -v
      - name: Guidance against the pinned private HTTP store
        working-directory: beam
        env:
          MIX_ENV: test
        run: mix test --include integration apps/atlas_facts/test/guidance_native_test.exs
      - run: sudo apt-get update && sudo apt-get install -y tmux lsof netcat-openbsd jq
      # rela-server, pinned in rela/scripts/start-test.sh; it downloads it when missing.
      - uses: actions/cache@v4
        with:
          path: .rela-bin
          key: rela-26.11.2-linux_amd64
      - run: mix compile --warnings-as-errors && mix format --check-formatted
        working-directory: e2e
      # bin/atlas itself: prod by default, test only when asked; bin/atlas-dev e2e never on prod.
      - run: mix test
        working-directory: e2e
      - run: bin/atlas-dev e2e --env test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: e2e/artifacts

  swift:
    name: Swift package of the contract (macOS, iOS)
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bff/targets/swift
    steps:
      - uses: actions/checkout@v4
      # bff/targets/swift is what `mix atlas.gen` writes (the contract job checks it is up to
      # date), and the message lines kept in Tests/Fixtures; a transport or app lives elsewhere.
      - name: The package holds only generated code and kept fixtures
        run: |
          handwritten=$(for f in $(find . -name '*.swift' -not -path './.build/*' -not -path './.swiftpm/*'); do head -2 "$f" | grep -q '^// Generated by atlas (mix atlas.gen)\. Do not edit' || echo "$f"; done)
          others=$(find . -type f -not -name '*.swift' -not -path './Tests/Fixtures/*' -not -path './.build/*' -not -path './.swiftpm/*')
          if [ -n "$handwritten$others" ]; then
            echo "::error::bff/targets/swift holds files mix atlas.gen does not write: $handwritten $others"
            exit 1
          fi
      - run: swift --version
      - run: swift build
      - run: swift test
      # Foundation only: the same package builds for iOS.
      - run: xcodebuild -scheme AtlasControlKit -destination 'generic/platform=iOS Simulator' build

  # Every test job passed on this tree: record it, so a later run on the same tree (develop
  # after integration, the release pull request, master) skips its tests. Only when this
  # run tested it itself, and never from a fork.
  record-tested-tree:
    name: Record the tested tree
    needs: [tested-tree, generator, contract, model-dsl, model-contract, beam, tui, agent, e2e, swift]
    if: >-
      needs.tested-tree.outputs.tested != 'true' && needs.tested-tree.outputs.tree != ''
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write the record
        env:
          TREE: ${{ needs.tested-tree.outputs.tree }}
        run: |
          mkdir -p "$RUNNER_TEMP/tested-tree"
          jq -n --arg tree "$TREE" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg event "$GITHUB_EVENT_NAME" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{tree: $tree, run_id: $run_id, attempt: $attempt, sha: $sha, ref: $ref, event: $event}' \
            > "$RUNNER_TEMP/tested-tree/record.json"
          echo "recorded: tree $TREE passed in run $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ needs.tested-tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree/record.json
          if-no-files-found: error
          overwrite: true

  # The base job passed: record this tree against the base key it checked.
  record-tested-base:
    name: Record the tree checked against its base
    needs: [tested-tree, model-base]
    if: >-
      needs.model-base.outputs.tree != '' && needs.model-base.outputs.base_key != ''
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write the record
        env:
          TREE: ${{ needs.model-base.outputs.tree }}
          BASE_KEY: ${{ needs.model-base.outputs.base_key }}
          BASE_COMMIT: ${{ needs.model-base.outputs.base_commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/tested-base"
          jq -n --arg tree "$TREE" --arg base_key "$BASE_KEY" --arg base_commit "$BASE_COMMIT" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{tree: $tree, base_key: $base_key, base_commit: $base_commit, run_id: $run_id, attempt: $attempt, sha: $sha, ref: $ref}' \
            > "$RUNNER_TEMP/tested-base/record.json"
          echo "recorded: tree $TREE passed against base file $BASE_KEY in run $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-base-${{ needs.model-base.outputs.tree }}-${{ needs.model-base.outputs.base_key }}
          path: ${{ runner.temp }}/tested-base/record.json
          if-no-files-found: error
          overwrite: true

  # A merge deploys its environment on Fly (d-0014): develop deploys test (IS-Atlas-26),
  # master deploys prod (IS-Atlas-79), once every check above passed, or was skipped because
  # this tree passed them before (tested-tree). fly/deploy.sh first checks that this build's
  # description describes the data rela holds there (else it deploys nothing), then deploys
  # rela and the core, then runs the smoke check, which reads only. Each app has its own
  # deploy token (fly tokens create deploy -a <app>). The smoke check reaches Control over
  # the tailnet, as every client does (D-0089): the job joins it first, as an ephemeral node
  # tagged tag:atlas-ci, with the secret TS_AUTHKEY_CI; without it nothing is deployed. The
  # action's tailscale is the core's (TAILSCALE_VERSION, fly/core.Dockerfile). Actions here
  # are pinned by tag, not by commit, and so is this one.
  deploy-test:
    name: Deploy test on Fly, and a smoke check
    needs: [tested-tree, generator, contract, model-dsl, model-contract, model-base, beam, tui, agent]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.tested-tree.outputs.tested == 'true' || !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-latest
    env:
      ATLAS_RELA_BIN: ${{ github.workspace }}/.rela-bin
      ATLAS_DEPLOY_RECOVERY: ${{ runner.temp }}/atlas-image-pair
      ATLAS_CONTROL_TEST_HOST: ${{ vars.ATLAS_CONTROL_TEST_HOST }}
      ATLAS_CONTROL_PROD_HOST: ${{ vars.ATLAS_CONTROL_PROD_HOST }}
    # Readiness order is not commit order. Keep queued jobs, then admit only the
    # current develop head inside the slot. Never cancel midway through a pair.
    concurrency:
      group: fly-deploy-test
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: python3 -m pip install -r rela/scripts/requirements.txt
      - name: Install the pinned schema validator in this deployment job
        run: rela/scripts/start-test.sh install
      - run: sudo apt-get update && sudo apt-get install -y lsof netcat-openbsd jq
      - name: The tailnet key, for the smoke check
        env:
          TS_AUTHKEY_CI: ${{ secrets.TS_AUTHKEY_CI }}
        run: |
          [ -n "$TS_AUTHKEY_CI" ] || { echo "::error::Add the secret TS_AUTHKEY_CI (an ephemeral, reusable, pre-approved tailnet key tagged tag:atlas-ci; docs/guides/prod.md, \"Secrets\")"; exit 1; }
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY_CI }}
          version: 1.104.7
      - name: Deploy test (rela, then the core), then the smoke check
        env:
          ATLAS_FLY_TOKEN_RELA: ${{ secrets.FLY_API_TOKEN_TEST_RELA }}
          ATLAS_FLY_TOKEN_CORE: ${{ secrets.FLY_API_TOKEN_TEST }}
        run: |
          [ -n "$ATLAS_FLY_TOKEN_RELA" ] || { echo "::error::Add the secret FLY_API_TOKEN_TEST_RELA (fly tokens create deploy -a eyra-atlas-test-rela)"; exit 1; }
          [ -n "$ATLAS_FLY_TOKEN_CORE" ] || { echo "::error::Add the secret FLY_API_TOKEN_TEST (fly tokens create deploy -a eyra-atlas-test)"; exit 1; }
          fly/deploy-test-current.sh "develop-$GITHUB_SHA"
      - name: Preserve recovery record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-image-pair-${{ github.run_id }}
          path: ${{ env.ATLAS_DEPLOY_RECOVERY }}
          retention-days: 7

  deploy-prod:
    name: Deploy prod on Fly, and a smoke check
    needs: [tested-tree, generator, contract, model-dsl, model-contract, model-base, beam, tui, agent, e2e]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.tested-tree.outputs.tested == 'true' || !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-latest
    env:
      ATLAS_RELA_BIN: ${{ github.workspace }}/.rela-bin
      ATLAS_DEPLOY_RECOVERY: ${{ runner.temp }}/atlas-image-pair
      ATLAS_CONTROL_TEST_HOST: ${{ vars.ATLAS_CONTROL_TEST_HOST }}
      ATLAS_CONTROL_PROD_HOST: ${{ vars.ATLAS_CONTROL_PROD_HOST }}
    # One deploy at a time; a newer merge waits for the running one.
    concurrency:
      group: fly-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: python3 -m pip install -r rela/scripts/requirements.txt
      - name: Install the pinned schema validator in this deployment job
        run: rela/scripts/start-test.sh install
      - run: sudo apt-get update && sudo apt-get install -y lsof netcat-openbsd jq
      - name: The tailnet key, for the smoke check
        env:
          TS_AUTHKEY_CI: ${{ secrets.TS_AUTHKEY_CI }}
        run: |
          [ -n "$TS_AUTHKEY_CI" ] || { echo "::error::Add the secret TS_AUTHKEY_CI (an ephemeral, reusable, pre-approved tailnet key tagged tag:atlas-ci; docs/guides/prod.md, \"Secrets\")"; exit 1; }
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY_CI }}
          version: 1.104.7
      - name: Deploy prod (rela, then the core), then the smoke check
        env:
          ATLAS_FLY_TOKEN_RELA: ${{ secrets.FLY_API_TOKEN_PROD_RELA }}
          ATLAS_FLY_TOKEN_CORE: ${{ secrets.FLY_API_TOKEN_PROD }}
        run: |
          [ -n "$ATLAS_FLY_TOKEN_RELA" ] || { echo "::error::Add the secret FLY_API_TOKEN_PROD_RELA (fly tokens create deploy -a eyra-atlas-rela)"; exit 1; }
          [ -n "$ATLAS_FLY_TOKEN_CORE" ] || { echo "::error::Add the secret FLY_API_TOKEN_PROD (fly tokens create deploy -a eyra-atlas)"; exit 1; }
          fly/deploy.sh prod "master-$GITHUB_SHA"
      - name: Preserve recovery record
        if: always()
        uses: actions/upload-artifact@v4
