# The core of Atlas prod on Fly (Bus, Facts, Flow, Control; IS-Atlas-79). Deployed from the
# repository root by CI on a merge to master:
#   fly deploy . --config fly/prod/core.toml --dockerfile fly/core.Dockerfile
# No [[services]] and no public address: the machine joins the tailnet as eyra-atlas
# (tag:atlas-prod, fly/core-run.sh, D-0089), and clients reach Control at eyra-atlas:7591
# and the Bus link at eyra-atlas:7594 there; the tailnet's ACL decides who may. It needs
# the secret TS_AUTHKEY for its first login; its tailnet state is on the volume
# (/data/tailscale), so a restart is the same node (docs/guides/prod.md, "Secrets").
app = "eyra-atlas"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[env]
  ATLAS_ENV = "prod"
  ATLAS_ENV_FILE = "/app/fly/prod/core.json"

[mounts]
  source = "core_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.control]
  type = "tcp"
  port = 7591
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
