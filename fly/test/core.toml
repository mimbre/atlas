# The core of Atlas test on Fly (Bus, Facts, Flow, Control; IS-Atlas-26). Deployed from the
# repository root by CI on a merge to develop:
#   fly deploy . --config fly/test/core.toml --dockerfile fly/core.Dockerfile
# No [[services]] and no public address: clients reach Control on test's own private
# network (eyra-atlas-test), over WireGuard; `atlas tui --env test` opens the tunnel.
app = "eyra-atlas-test"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[env]
  ATLAS_ENV = "test"
  ATLAS_ENV_FILE = "/app/fly/test/core.json"
  # SSH-local release RPC for test fixtures; no distributed Erlang port is exposed.
  RELEASE_DISTRIBUTION = "sname"
  RELEASE_NODE = "atlas@localhost"
  ERL_EPMD_ADDRESS = "127.0.0.1"
  ERL_AFLAGS = "-kernel inet_dist_use_interface '{127,0,0,1}'"

[mounts]
  source = "core_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.control]
  type = "tcp"
  port = 7691
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
