# Software: Issue. Built in one pull request, done when that is merged.
# Plain rela 26.11.2 flows.yaml. The Atlas layer (links) is in flows.atlas.yaml,
# keyed by flow and state. pr_outcome is written only by the Atlas layer (role
# atlas-flow), from the pull request's subflow. Slice 9: no passes, gates or
# publish effect yet; it starts when the issue is created.
flows:
  issue:
    label: Issue
    subject: issue
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: author
    states:
      author:
        label: Building
        on:
          change:
            - { to: author, roles: [atlas-flow], when: "entity.pr_outcome == 'changes_requested'" }
            - { to: done, roles: [atlas-flow], when: "entity.pr_outcome == 'integrated'" }
            - { to: author, roles: [atlas-flow], when: "entity.pr_outcome == 'closed'" }
      done:
        label: Integrated
        final: true
