# Software: Scene. Replaces today's test_and_accept for scenes.
# children and open_children are kept by the Atlas count on the use case flow.
# Slice 12: no passes; the decider's verdict ends to_test (as test_and_accept_use_case).
flows:
  test_and_accept_scene:
    label: Build, test and accept
    subject: scene
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: break_down
    states:
      break_down:
        label: Break it down into use cases
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.children > 0" }
      building:
        label: Build it
        on:
          change:
            - { to: break_down, roles: [atlas-flow], when: "entity.children == 0" }
            - { to: to_test, roles: [atlas-flow], when: "entity.open_children == 0" }
      to_test:
        label: Test it
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, when: "entity.verdict == 'accept'" }
            - { to: rework, when: "entity.verdict == 'reject'" }
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      rework:
        label: Rework it
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      accepted:
        label: Accepted
        final: true
