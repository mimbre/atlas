# Software: Use Case. design_and_accept is the design phase;
# test_and_accept_use_case replaces today's test_and_accept for use cases.
# children and open_children are kept by the Atlas link on the Issue flow
# (conditions cannot follow relations).
# Changed from the approved input definition (coordinator, flow-compose-2): the result
# field is design_status, not design, which holds the Architect's text of the design.
# Slice 10: design_and_accept has no passes, design gate, acceptor or maintainer yet;
# each state moves on the design_status written by hand, and the review's approved
# accepts the design.
# Slice 11: test_and_accept_use_case has no passes yet; to_test resets verdict on entry
# and moves on the verdict the decider's answers write, not on an acceptor's choice; a
# new open issue sends it back to building; a use case without a design phase is neither
# broken down nor tested while nothing is under it.
flows:
  design_and_accept:
    label: Design and accept
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: designing
    states:
      designing:
        label: Design pass
        on:
          change:
            - { to: accepted, when: "entity.design_status == 'approved' or entity.design_status == 'accepted'" }
            - { to: design_review, when: "entity.design_status == 'in_review'" }
      design_review:
        label: Design review pass
        on:
          change:
            - { to: accepted, when: "entity.design_status == 'approved' or entity.design_status == 'accepted'" }
            - { to: redesign, when: "entity.design_status == 'changes_requested' or entity.design_status == 'writing'" }
      redesign:
        label: Design rework pass
        on:
          change:
            - { to: accepted, when: "entity.design_status == 'approved' or entity.design_status == 'accepted'" }
            - { to: design_review, when: "entity.design_status == 'in_review'" }
      accepted:
        label: Design accepted
        final: true
        outputs:
          - set: { properties: { design_status: accepted } }
  test_and_accept_use_case:
    label: Build, test and accept
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.design_status == 'accepted'"
    initial: break_down
    states:
      break_down:
        label: Break it down into issues
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.children > 0" }
      building:
        label: Build it
        on:
          change:
            - { to: break_down, roles: [atlas-flow], when: "entity.children == 0 and (entity.design_status == 'approved' or entity.design_status == 'accepted')" }
            - { to: to_test, roles: [atlas-flow], when: "entity.children > 0 and entity.open_children == 0" }
      to_test:
        label: Test it
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, when: "entity.verdict == 'accept'" }
            - { to: rework, when: "entity.verdict == 'reject'" }
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      rework:
        label: Rework it
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      accepted:
        label: Accepted
        final: true
