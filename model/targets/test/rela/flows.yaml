# Generated by atlas (mix model.gen) from model/contract/compositions/atlas_eyra.ex, model/contract/software/issue.ex, model/contract/software/pull_request.ex, model/contract/software/pr_review.ex, model/contract/software/pr_test.ex, model/contract/eyra/use_case.ex, model/contract/eyra/scene.ex, model/contract/foundation/decision.ex, model/contract/software/follow_through.ex. Do not edit: change the contract and regenerate.
flows:
  issue:
    label: Issue
    subject: issue
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: author
    states:
      author:
        label: Building
        on:
          change:
            - { to: author, roles: [atlas-flow], when: "entity.pr_outcome == 'changes_requested'" }
            - { to: done, roles: [atlas-flow], when: "entity.pr_outcome == 'integrated'" }
            - { to: author, roles: [atlas-flow], when: "entity.pr_outcome == 'closed'" }
      done:
        label: Integrated
        final: true
  pull_request:
    label: Pull request
    subject: pull_request
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: checking
    states:
      checking:
        label: Review and test
        outputs:
          - set: { properties: { review_outcome: none, test_outcome: none, update: none } }
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.review_outcome == 'changes_requested'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.test_outcome == 'failed'" }
            - { to: integrating, roles: [atlas-flow], when: "entity.review_outcome == 'approved' and entity.test_outcome == 'passed'" }
      changes_requested:
        label: Changes requested
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: checking, when: "entity.update == 'updated'" }
      integrating:
        label: Integrate
        outputs:
          - set: { properties: { integration: none } }
        on:
          change:
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: checking, when: "entity.update == 'updated'" }
            - { to: integrated, roles: [atlas-flow], when: "entity.integration == 'done'" }
            - { to: blocked, roles: [atlas-flow], when: "entity.integration == 'refused'" }
      blocked:
        label: Integration blocked
        on:
          change:
            - { to: integrated, when: "entity.state == 'merged'" }
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: integrating, when: "entity.integration == 'retry'" }
            - { to: checking, when: "entity.update == 'updated'" }
      integrated:
        label: Integrated
        final: true
      closed:
        label: Closed
        final: true
        status: cancelled
  pr_review:
    label: PR review
    subject: pr_review
    per_subject: one
    start:
      - on: create
    initial: working
    states:
      working:
        label: PR review in progress
        status: input_required
        waiting_for: [reviewer]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: approved, roles: [reviewer], when: "entity.verdict == 'approved'" }
            - { to: changes_requested, roles: [reviewer], when: "entity.verdict == 'changes_requested'" }
        after:
          stalled: { period: 3d, to: escalated, label: No outcome in three days }
      escalated:
        label: Escalated
        status: input_required
        waiting_for: [maintainer, reviewer]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: approved, roles: [maintainer, reviewer], when: "entity.verdict == 'approved'" }
            - { to: changes_requested, roles: [maintainer, reviewer], when: "entity.verdict == 'changes_requested'" }
      approved:
        final: true
      changes_requested:
        final: true
      superseded:
        label: Superseded by a newer PR revision
        final: true
        status: cancelled
  pr_test:
    label: PR test
    subject: pr_test
    per_subject: one
    start:
      - on: create
    initial: working
    states:
      working:
        label: PR test in progress
        status: input_required
        waiting_for: [tester]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: passed, roles: [tester], when: "entity.verdict == 'passed'" }
            - { to: failed, roles: [tester], when: "entity.verdict == 'failed'" }
        after:
          stalled: { period: 3d, to: escalated, label: No outcome in three days }
      escalated:
        label: Escalated
        status: input_required
        waiting_for: [maintainer, tester]
        on:
          change:
            - { to: superseded, when: "entity.superseded == true" }
            - { to: passed, roles: [maintainer, tester], when: "entity.verdict == 'passed'" }
            - { to: failed, roles: [maintainer, tester], when: "entity.verdict == 'failed'" }
      passed:
        final: true
      failed:
        final: true
      superseded:
        label: Superseded by a newer PR revision
        final: true
        status: cancelled
  design_and_accept:
    label: Design and accept
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: designing
    states:
      designing:
        label: Design pass
        on:
          change:
            - { to: accepted, when: "entity.design_status == 'approved' or entity.design_status == 'accepted'" }
            - { to: design_review, when: "entity.design_status == 'in_review'" }
      design_review:
        label: Design review pass
        on:
          change:
            - { to: accepted, when: "entity.design_status == 'approved' or entity.design_status == 'accepted'" }
            - { to: redesign, when: "entity.design_status == 'changes_requested' or entity.design_status == 'writing'" }
      redesign:
        label: Design rework pass
        on:
          change:
            - { to: accepted, when: "entity.design_status == 'approved' or entity.design_status == 'accepted'" }
            - { to: design_review, when: "entity.design_status == 'in_review'" }
      accepted:
        label: Design accepted
        final: true
        outputs:
          - set: { properties: { design_status: accepted } }
  test_and_accept_use_case:
    label: Build, test and accept
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.design_status == 'accepted'"
    initial: break_down
    states:
      break_down:
        label: Break it down into issues
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.children > 0" }
      building:
        label: Build it
        on:
          change:
            - { to: break_down, roles: [atlas-flow], when: "entity.children == 0 and (entity.design_status == 'approved' or entity.design_status == 'accepted')" }
            - { to: to_test, roles: [atlas-flow], when: "entity.children > 0 and entity.open_children == 0" }
      to_test:
        label: Test it
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, when: "entity.verdict == 'accept'" }
            - { to: rework, when: "entity.verdict == 'reject'" }
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      rework:
        label: Rework it
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      accepted:
        label: Accepted
        final: true
  test_and_accept_scene:
    label: Build, test and accept
    subject: scene
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: break_down
    states:
      break_down:
        label: Break it down into use cases
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.children > 0" }
      building:
        label: Build it
        on:
          change:
            - { to: break_down, roles: [atlas-flow], when: "entity.children == 0" }
            - { to: to_test, roles: [atlas-flow], when: "entity.open_children == 0" }
      to_test:
        label: Test it
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, when: "entity.verdict == 'accept'" }
            - { to: rework, when: "entity.verdict == 'reject'" }
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      rework:
        label: Rework it
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
      accepted:
        label: Accepted
        final: true
  decide:
    label: Decide
    subject: decision
    run_as: system:atlas-flow
    per_subject: one
    start:
      - on: create
    initial: deciding
    states:
      deciding:
        label: Who decides
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: for_person_always, roles: [atlas-flow], when: "entity.gate_result == 'person_always'" }
            - { to: for_person, roles: [atlas-flow], when: "entity.gate_result == 'person'" }
            - { to: for_agent, roles: [atlas-flow], when: "entity.gate_result == 'agent'" }
            - { to: for_agent_unverified, roles: [atlas-flow], when: "entity.gate_result == 'agent_unverified'" }
      for_person_always:
        label: A person decides
        status: input_required
        waiting_for: [principle_authority, decider]
        on:
          change:
            - { to: accepted, roles: [principle_authority, decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [principle_authority, decider], when: "entity.status == 'rejected'" }
      for_person:
        label: Waiting for a person
        status: input_required
        waiting_for: [decider]
        on:
          change:
            - { to: accepted, roles: [decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [decider], when: "entity.status == 'rejected'" }
        after:
          no_answer: { period: 5m, to: deciding }
      for_agent:
        label: An agent may decide
        status: input_required
        waiting_for: [delegate, decider]
        on:
          change:
            - { to: accepted, roles: [delegate, decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [delegate, decider], when: "entity.status == 'rejected'" }
      for_agent_unverified:
        label: Unverified agent decision
        status: input_required
        waiting_for: [delegate, decider]
        outputs:
          - set: { properties: { unverified: true } }
        on:
          change:
            - { to: accepted, roles: [delegate, decider], when: "entity.status == 'accepted'" }
            - { to: rejected, roles: [delegate, decider], when: "entity.status == 'rejected'" }
      accepted:
        label: Accepted
        final: true
      rejected:
        label: Rejected
        final: true
  follow_through:
    label: Follow through
    subject: decision
    per_subject: one
    start:
      - on: predicate
        when: "entity.status == 'accepted'"
    initial: waiting
    states:
      waiting:
        label: Carry it out
        on:
          change:
            - { to: no_work, when: "entity.no_work == true" }
            - { to: superseded, when: "entity.status == 'superseded'" }
            - { to: carried_out, when: "entity.work > 0" }
      carried_out:
        label: Carried out
        final: true
      no_work:
        label: No work needed
        final: true
      superseded:
        label: Superseded
        final: true
        status: cancelled
