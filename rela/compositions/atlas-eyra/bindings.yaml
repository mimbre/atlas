# Composition owns the complete list of assignable kinds, and what a gate verdict is about.
relations:
  assignment:
    label: assignment
    description: What belongs to being assigned, for one fact; made and deleted with it.
    from:
    - scene
    - use_case
    - issue
    - pull_request
    - decision
    - to_do
    to:
    - assignment
    max_outgoing: 1
    inverse:
      id: assignment_of
      label: assignment of
  based_on:
    label: based on
    description: The decisions this work carries out; optional, most work has none.
    from:
    - scene
    - use_case
    - issue
    - to_do
    to:
    - decision
    inverse:
      id: work
      label: work
  about:
    label: about
    description: The fact a gate verdict decided on; any kind the composition has.
    from:
    - gate_verdict
    to:
    - scene
    - use_case
    - issue
    - pull_request
    - decision
    max_outgoing: 1
    inverse:
      id: gate_verdicts
      label: gate verdicts
