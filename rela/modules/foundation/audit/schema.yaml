# Complete definitions; included paths are relative to the selected root.
types:
  agent_outcome:
    values:
    - proposed
    - running
    - done
    - done_without_asking
    - stopped
    - refused
    - cancelled
    - failed
    labels:
      proposed: Proposed
      running: Running
      done: Done
      done_without_asking: Done without asking
      stopped: Stopped
      refused: Refused
      cancelled: Cancelled
      failed: Failed
  agent_step_state:
    values:
    - stored
    - refused
    - dropped
    - not_run
    labels:
      stored: Stored
      refused: Refused
      dropped: Dropped
      not_run: Not run
entities:
  agent_request:
    label: Agent request
    plural: agent_requests
    aliases:
    - rq
    id_type: manual
    id_prefix: RQ-
    description: |
      What Melle asked the agent on a page of the TUI (`:`), and what became of
      it: the plan's summary and its outcome. Its steps hang under it. The cause
      of every change the agent made (SC-Atlas-04, UC-Atlas-19).
    properties:
      title:
        type: string
        required: true
        description: The request, in Melle's words
      page:
        type: string
        description: The page it was asked on
      planner:
        type: string
        description: Who planned it
      outcome:
        type: agent_outcome
        description: What became of it
      summary:
        type: string
        description: What the agent said about its plan
      before:
        type: string
        description: What became of the previous plan, after a refusal
      overrules:
        type: string
        description: The request this one overrules (d-0016)
  agent_step:
    label: Agent step
    plural: agent_steps
    aliases:
    - st
    id_type: manual
    id_prefix: ST-
    description: |
      One step of a request's plan: the form it filled, with what values, and
      what became of it, with the key of the item it made, changed or deleted.
    properties:
      title:
        type: string
        required: true
        description: The title of the form it filled
      n:
        type: integer
        description: Its number in the plan
      tool:
        type: string
        description: put, set or delete
      state:
        type: agent_step_state
        description: What became of it
      detail:
        type: string
        description: The id it stored, or why it was refused
      made:
        type: string
        description: The key of the item it made, changed or deleted
      values:
        type: string
        description: The values it gave, as JSON
      was:
        type: string
        description: 'For a change: the values it replaced, as JSON'
relations:
  in_request:
    label: in request
    description: A step belongs to the request whose plan it was part of.
    from:
    - agent_step
    to:
    - agent_request
    max_outgoing: 1
    inverse:
      id: steps
      label: steps
