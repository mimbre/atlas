# Complete definitions; included paths are relative to the selected root.
types:
  turn_state:
    values:
    - running
    - ended
    labels:
      running: Running
      ended: Ended
  decision_category:
    values:
    - product
    - process
    - domain
    - architecture
    - interface
    - technology
    - security
    - operations
    descriptions:
      product: What is built, for whom, what is in or out
      process: 'How work moves: phases, passes, gates, roles, release'
      domain: Concepts, entities, relations and vocabulary
      architecture: Components, their responsibilities, boundaries and contracts
      interface: 'What people and clients see and call: UI, CLI, API and wire'
      technology: Choice of tool, platform, library or version
      security: Trust boundaries, permissions, credentials and data access
      operations: Environments, deployment, backups, machines
  decision_scope:
    values:
    - platform
    - software
    - instance
    labels:
      platform: Platform
      software: Software
      instance: Instance
    descriptions:
      platform: The generic mechanisms, whatever workflow runs on them
      software: 'How software gets built here: issues, pull requests and their flows'
      instance: 'One installation: its environments, machines, accounts'
  decision_reversibility:
    values:
    - one_way
    - two_way
    labels:
      one_way: One-way
      two_way: Two-way
    descriptions:
      one_way: Costly or impossible to undo; always accepted by a person
      two_way: Cheap to undo; may be accepted with delegated authority
  decision_force:
    values:
    - direction
    - guideline
    - guardrail
    - principle
    descriptions:
      direction: Where we go; future work is based on it
      guideline: How work should be done; deviation is allowed with a reason
      guardrail: What work must or must not do; a violation blocks
      principle: What never happens, by anyone; enforced by the system
  decision_status:
    values:
    - proposed
    - accepted
    - rejected
    - superseded
    labels:
      proposed: Proposed
      accepted: Accepted
      rejected: Rejected
      superseded: Superseded
  gate_flavor:
    values:
    - rule
    - smart
    descriptions:
      rule: Deterministic rules alone decide
      smart: Jev advises; deterministic rules on top decide
  gate_purpose:
    values:
    - flow
    - decider
    descriptions:
      flow: Decides the next step of a flow
      decider: Decides whether a person or an agent makes a decision
  gate_unsettled:
    values:
    - uncertain
    - error
    descriptions:
      uncertain: The gate could not tell; its policy took the safe outcome
      error: The evaluation failed or timed out; never a pass
entities:
  person:
    label: Person
    plural: people
    id_type: manual
    description: |
      Someone who works with Atlas. The id is short and lower case, made from
      the name, e.g. melle.
    properties:
      name:
        type: string
        required: true
        description: As it is shown
  agent:
    label: Agent
    plural: agents
    id_type: manual
    description: |
      An agent that works with Atlas. The id is short and lower case, made from the
      name, e.g. coordinator.
    properties:
      name:
        type: string
        required: true
        description: As it is shown
      cannot_run:
        type: string
        description: Where and since when it cannot run, and why (3 crashes in 10 minutes); Runtime writes and clears it (IS-Atlas-18)
  assignment:
    label: Assignment
    plural: assignments
    id_type: manual
    id_prefix: AS-
    description: |
      What belongs to being assigned, for one fact: who it is assigned to and what
      they are expected to do. Made and deleted with the fact; its id is AS- and the
      fact's, e.g. AS-UC-Atlas-01.
    properties:
      of:
        type: string
        required: true
        description: The key of the fact it belongs to
      expected:
        type: string
        description: What its owner is expected to do next; Flow writes it (IS-Atlas-53)
      deadline:
        type: datetime
        description: When it should be done by; optional, it only marks it late (IS-Atlas-14)
      handover:
        type: string
        description: A deferred automatic handover; Flow keeps it until the running owner ends its turn
      flow_state:
        type: string
        description: The state of its flow it is in; Flow writes it (IS-Atlas-54)
  turn:
    label: Turn
    plural: turns
    id_type: manual
    id_prefix: TU-
    description: |
      One stretch in which an agent acts on one item: started by Runtime for the item's
      owner, kept while the agent shows activity (its lease), ended when the agent ends
      it, goes silent, crashes, runs too long, or no longer owns the item.
    properties:
      state:
        type: turn_state
        required: true
        description: Running or ended
      machine:
        type: string
        required: true
        description: The machine whose Runtime runs it
      lease_until:
        type: datetime
        description: 'Until when the turn holds its lease: the agent''s last activity plus the silence limit'
      activity:
        type: string
        description: The agent's last activity Runtime saw
      why:
        type: string
        description: Why it ended
      ended_at:
        type: datetime
        description: When it ended
      outcome:
        type: string
        description: The agent's fact about what it did; Runtime reads it and ends the turn
      attempt:
        type: string
        description: Runtime execution fence; a new attempt never inherits old guidance.
  worker_execution:
    label: Worker execution
    plural: worker_executions
    id_type: manual
    description: Immutable durable execution; only the Facts guidance operation writes this record.
    properties:
      environment:
        type: string
        required: true
      worker:
        type: string
        required: true
      turn:
        type: string
        required: true
      attempt:
        type: string
        required: true
      machine:
        type: string
        required: true
      harness:
        type: string
        required: true
      harness_version:
        type: string
        required: true
      configured_model:
        type: string
        required: true
      reported_model:
        type: string
      capability_version:
        type: string
        required: true
      queued_input:
        type: boolean
        required: true
      durable_accept_query:
        type: boolean
        required: true
      consumption_evidence:
        type: boolean
        required: true
      recorded_position:
        type: integer
        required: true
      recorded_at:
        type: datetime
        required: true
  interaction:
    label: Interaction
    plural: interactions
    id_type: manual
    description: Immutable durable interaction; only the Facts guidance operation writes this record.
    properties:
      environment:
        type: string
        required: true
      actor:
        type: string
        required: true
      client_key:
        type: string
        required: true
      body:
        type: string
        required: true
      body_digest:
        type: string
        required: true
      worker:
        type: string
        required: true
      turn:
        type: string
        required: true
      attempt:
        type: string
        required: true
      mode:
        type: string
        required: true
      execution:
        type: string
        required: true
      cause:
        type: string
        required: true
      recorded_position:
        type: integer
        required: true
      recorded_at:
        type: datetime
        required: true
  interaction_receipt:
    label: Interaction receipt
    plural: interaction_receipts
    id_type: manual
    description: Immutable durable receipt; only the Facts guidance operation writes this record.
    properties:
      environment:
        type: string
        required: true
      interaction:
        type: string
        required: true
      worker:
        type: string
        required: true
      turn:
        type: string
        required: true
      attempt:
        type: string
        required: true
      execution:
        type: string
        required: true
      stage:
        type: string
        required: true
      evidence_id:
        type: string
        required: true
      admission_id:
        type: string
      consumption_id:
        type: string
      reason:
        type: string
      writer:
        type: string
        required: true
      cause:
        type: string
        required: true
      recorded_position:
        type: integer
        required: true
      recorded_at:
        type: datetime
        required: true
  decision:
    label: Decision
    plural: decisions
    aliases:
    - dr
    id_type: manual
    id_prefix: D-
    description: |
      One decision record in the append-only ledger: the rule, why, and what follows
      from it. An accepted decision is never edited; a newer decision supersedes it. The id
      is D- and a number, e.g. D-0024.
    properties:
      title:
        type: string
        required: true
        description: The decision in a few words
      decision:
        type: string
        required: true
        description: The rule, in one or two sentences
      context:
        type: string
        description: Why it was decided
      consequences:
        type: string
        description: What changes because of it
      category:
        type: decision_category
        description: What it is about
      scope:
        type: decision_scope
        description: How widely it holds
      reversibility:
        type: decision_reversibility
        description: How costly undoing it is
      force:
        type: decision_force
        description: How it acts on work
      enforced_by:
        type: string
        description: The test, check or gate that enforces it; required for a principle
      status:
        type: decision_status
        description: Proposed, accepted, rejected or superseded
      decided_at:
        type: datetime
        description: When it was accepted or rejected
      no_work:
        type: boolean
        description: True when carrying it out needs no work; it then waits for none
      unverified:
        type: boolean
        description: An agent decided after the person answer limit; cleared by review
      gate_result:
        type: string
        description: 'Flow: gate activity result; the durable run holds its trusted source'
      verdict:
        type: string
        description: 'Flow: the verdict of whoever may decide it (none, accept, reject)'
  gate_verdict:
    label: Gate verdict
    plural: gate_verdicts
    id_type: manual
    id_prefix: GV-
    description: |
      One gate decision, recorded in full: what the gate saw, what it chose, what
      it could have chosen and, later, how good that turned out. Immutable once written;
      each later outcome is set once. The id is GV- and a number, e.g. GV-0001.
    properties:
      gate:
        type: string
        required: true
        description: Which gate decided, e.g. integrate
      gate_version:
        type: string
        required: true
        description: The version of the gate's definition that decided
      activity_id:
        type: string
        description: Durable caller activity identity, when asked by Flow
      activity_digest:
        type: string
        description: Frozen activity payload digest; reuse with another payload is refused
      flavor:
        type: gate_flavor
        required: true
        description: Rule or smart
      purpose:
        type: gate_purpose
        required: true
        description: Flow or decider
      subject:
        type: string
        required: true
        description: What it decided on, the key or reference of the fact or change
      fingerprint:
        type: string
        required: true
        description: The exact version of the subject it decided on
      evidence:
        type: string
        description: References to the evidence it decided on, one per line
      evidence_digest:
        type: string
        required: true
        description: The content digest of the immutable evidence snapshot, e.g. sha256:...
      rule_outcome:
        type: string
        description: What the deterministic rules said
      rule_version:
        type: string
        description: The version of those rules
      advisor:
        type: string
        description: Who advised a smart gate, e.g. jev
      model:
        type: string
        description: The model, prompt and evaluator settings the advice came from
      rationale:
        type: string
        description: Why the advice is what it is
      scores:
        type: string
        description: The advice per outcome, as text, e.g. pass 0.7, changes_required 0.3
      verdict:
        type: string
        required: true
        description: The outcome the gate chose; one of allowed_outcomes
      allowed_outcomes:
        type: string
        required: true
        description: The outcomes it could choose, separated by commas
      unsettled:
        type: gate_unsettled
        description: Uncertain or error, when the gate could not decide on its own
      cost:
        type: string
        description: What the evaluation cost, e.g. 0.012 USD
      duration_ms:
        type: integer
        description: How long the evaluation took, in milliseconds
      decided_at:
        type: datetime
        required: true
        description: When it decided
      overrule_reason:
        type: string
        description: Later, why a person overruled it
      rework_after:
        type: string
        description: Later, the rework needed after all, and what showed it
      defect_after:
        type: string
        description: Later, a problem found afterwards, and where
      effort:
        type: string
        description: Later, the time and human effort spent after it
  flow_run:
    label: Flow run
    plural: flow_runs
    id_type: manual
    description: Durable generated state machine cursor, written only by its runner.
    properties:
      flow:
        type: string
      subject_kind:
        type: string
      subject_key:
        type: string
      generation:
        type: integer
      definition_sha256:
        type: string
      state:
        type: string
      entry:
        type: integer
      entered_at:
        type: string
      status:
        type: string
      deadlines:
        type: string
      pending:
        type: string
      input_cursor:
        type: integer
      last_input:
        type: string
      blocked_reason:
        type: string
  flow_input:
    label: Flow input
    plural: flow_inputs
    id_type: manual
    description: Typed trusted choice operation, prepared before its subject write.
    properties:
      request_id:
        type: string
      run:
        type: string
      flow:
        type: string
      subject_kind:
        type: string
      subject_key:
        type: string
      generation:
        type: integer
      entry:
        type: integer
      source_version:
        type: string
      subject_version:
        type: string
      actor:
        type: string
      roles:
        type: string
      changed_fields:
        type: string
      links:
        type: string
      payload_digest:
        type: string
      status:
        type: string
      position:
        type: integer
      prepared_at:
        type: string
      applied_at:
        type: string
relations:
  assigned_to:
    label: assigned to
    description: Who is next in line to do something with it; one, a person or an agent.
    from:
    - assignment
    to:
    - person
    - agent
    max_outgoing: 1
    inverse:
      id: assignments
      label: assignments
  turn_on:
    label: 'on'
    description: The item the turn acts on.
    from:
    - turn
    to:
    - assignment
    max_outgoing: 1
    inverse:
      id: turns
      label: turns
  turn_by:
    label: by
    description: The agent that acts in the turn.
    from:
    - turn
    to:
    - agent
    max_outgoing: 1
    inverse:
      id: turns_by
      label: turns
  decided_by:
    label: decided by
    description: Who accepted or rejected the decision; one, a person or an agent.
    from:
    - decision
    to:
    - person
    - agent
    max_outgoing: 1
    inverse:
      id: decided
      label: decided
  delegated_by:
    label: delegated by
    description: The person whose delegated authority an agent decided under; at most one.
    from:
    - decision
    to:
    - person
    max_outgoing: 1
    inverse:
      id: delegated
      label: delegated
  supersedes:
    label: supersedes
    description: The accepted decisions this one replaces; they become superseded when it is accepted.
    from:
    - decision
    to:
    - decision
    inverse:
      id: superseded_by
      label: superseded by
  follows_from:
    label: follows from
    description: The higher-level decisions this one elaborates.
    from:
    - decision
    to:
    - decision
    inverse:
      id: elaborated_by
      label: elaborated by
  follows:
    label: follows
    description: The previous verdict on the same subject; verdicts so form an episode.
    from:
    - gate_verdict
    to:
    - gate_verdict
    max_outgoing: 1
    inverse:
      id: followed_by
      label: followed by
  overruled_by:
    label: overruled by
    description: Later, the person who overruled the verdict; at most one.
    from:
    - gate_verdict
    to:
    - person
    max_outgoing: 1
    inverse:
      id: overruled
      label: overruled
  reviewed_by:
    label: confirmed by
    description: The person who confirms an unverified verdict; set once to themselves.
    from:
    - gate_verdict
    to:
    - person
    max_outgoing: 1
    inverse:
      id: reviewed_verdicts
      label: confirmed verdicts
