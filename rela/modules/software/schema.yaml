# Complete definitions; included paths are relative to the selected root.
types:
  issue_stage:
    values:
    - specification
    - design
    - development
    labels:
      specification: Specification
      design: Design
      development: Development
  pull_request_state:
    values:
    - open
    - closed
    - merged
    labels:
      open: Open
      closed: Closed
      merged: Merged
  github_pull_url:
    description: The web address of a GitHub pull request
    validations:
    - pattern: ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[0-9]+$
      error: Must be a GitHub pull request URL, e.g. https://github.com/eyra/atlas/pull/12
entities:
  issue:
    label: Issue
    plural: issues
    aliases:
    - is
    id_type: manual
    id_prefix: IS-
    description: 'Small, independently testable work, normally one pull request (Flux''s

      meaning). The id is its Atlas code, e.g. IS-Atlas-01.

      '
    properties:
      title:
        type: string
        required: true
        description: 'Without the code (Flux: name)'
      description:
        type: string
        description: 'The text (Flux: description)'
      flux_id:
        type: string
        unique: true
        description: Flux (Basecamp) id, set by a later Flux sync
      stage:
        type: issue_stage
        description: 'Flux: stage'
      flux_ref:
        type: string
        unique: true
        description: Flux's own issue code (ref), e.g. NEXT-240, set by a later Flux sync
  pull_request:
    label: Pull request
    plural: pull_requests
    aliases:
    - pr
    id_type: manual
    id_prefix: PR-
    description: 'A GitHub pull request for an issue. Linked by URL; a GitHub connector

      fills title and state later. The id is derived from the URL,

      PR-<owner>-<repo>-<number>, so linking the same URL twice is one record.

      '
    properties:
      url:
        type: github_pull_url
        required: true
        unique: true
        description: 'GitHub: url'
      title:
        type: string
        description: 'GitHub: title'
      state:
        type: pull_request_state
        description: 'GitHub: state'
      draft:
        type: boolean
        default: false
        description: 'GitHub: isDraft'
relations:
  in_issue:
    label: in issue
    description: A pull request belongs to at most one issue; an issue has zero or more pull requests.
    from:
    - pull_request
    to:
    - issue
    max_outgoing: 1
    inverse:
      id: pull_requests
      label: pull requests
  done_in:
    label: also done in
    description: A merged pull request of another issue that also did this one.
    from:
    - issue
    to:
    - pull_request
    inverse:
      id: also_done
      label: also done
