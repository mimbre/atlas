# Complete definitions; included paths are relative to the selected root.
types:
  plan_status:
    values:
    - refine
    - ready_to_pick_up
    labels:
      refine: Refine
      ready_to_pick_up: Ready to pick up
    descriptions:
      refine: Being written and negotiated; not ready to build from.
      ready_to_pick_up: Agreed; the next level can be derived and built.
  design_status:
    values:
    - writing
    - in_review
    - changes_requested
    - approved
    - accepted
    labels:
      writing: Writing
      in_review: In review
      changes_requested: Changes requested
      approved: Approved
      accepted: Accepted
    descriptions:
      writing: The Design part is being written.
      in_review: The Design part waits for its review pass.
      changes_requested: The review sent the Design part back.
      approved: The review approved the Design part; it can be broken down and built.
      accepted: An acceptor accepted the design (flow design_and_accept); building starts.
entities:
  scene:
    label: Scene
    plural: scenes
    aliases:
    - sc
    id_type: manual
    id_prefix: SC-
    description: |
      An actor-centred view of the system, with one angle and one zoom level
      (Flux's meaning). The id is its code, e.g. SC-Atlas-01.
    properties:
      title:
        type: string
        required: true
        description: 'Without the code (Flux: name)'
      description:
        type: string
        description: 'The text (Flux: description)'
      flux_id:
        type: string
        unique: true
        description: Flux (Basecamp) id, set by a later Flux sync
      status:
        type: plan_status
        description: Flux group; empty = no group
      children:
        type: integer
        description: 'Flow: how many use cases are in it'
      open_children:
        type: integer
        description: 'Flow: how many of them are not finished'
      verdict:
        type: string
        description: 'Flow: the acceptor''s verdict (none, accept, reject)'
      pass_result:
        type: string
        description: 'Flow: how the last pass ended (none, delivered, failed)'
  use_case:
    label: Use case
    plural: use_cases
    aliases:
    - uc
    id_type: manual
    id_prefix: UC-
    description: |
      The technical contract for part of a scene (Flux's meaning). The id is
      its code, e.g. UC-Atlas-01.
    properties:
      title:
        type: string
        required: true
        description: 'Without the code (Flux: name)'
      description:
        type: string
        description: 'The text (Flux: description)'
      flux_id:
        type: string
        unique: true
        description: Flux (Basecamp) id, set by a later Flux sync
      status:
        type: plan_status
        description: Flux group; empty = no group
      design:
        type: string
        description: 'The Design part: how it is built, written by the Architect'
      design_status:
        type: design_status
        description: Where the Design part is; empty for a use case without a design phase
      children:
        type: integer
        description: 'Flow: how many issues are in it'
      open_children:
        type: integer
        description: 'Flow: how many of them are not finished'
      verdict:
        type: string
        description: 'Flow: the acceptor''s verdict (none, accept, reject)'
      pass_result:
        type: string
        description: 'Flow: how the last pass ended (none, delivered, failed)'
      gate_result:
        type: string
        description: 'Flow: the last design gate verdict, or a maintainer''s choice (none, review, rework, ready, person, close)'
relations:
  in_scene:
    label: in scene
    description: A use case belongs to at most one scene (Flux); a scene has zero or more use cases.
    from:
    - use_case
    to:
    - scene
    max_outgoing: 1
    inverse:
      id: use_cases
      label: use cases
  in_use_case:
    label: in use case
    description: An issue belongs to at most one use case (Flux); a use case has zero or more issues.
    from:
    - issue
    to:
    - use_case
    max_outgoing: 1
    inverse:
      id: issues
      label: issues
  accepted_by:
    label: accepted by
    description: Who accepted a scene or use case, after testing it; at most one.
    from:
    - scene
    - use_case
    to:
    - person
    max_outgoing: 1
    inverse:
      id: accepted
      label: accepted
