# Atlas description in the current rela (upstream sourcehaven-bv/rela v26.10.14).
# Grows one entity at a time: Scene (IS-02), then Use case (IS-08), Issue
# (IS-10), Pull request (IS-11). A new entity is a change to this file only.
#
# Scene, Use case and Issue keep Flux's meaning and fields, so a Flux connector
# can sync them later. Ids are the codes (SC-Atlas-01): the writer chooses
# them, so a resent create is safe; flux_id holds Flux's id once synced.
#
# Shared shapes (rela has no base types and refuses unknown top-level keys;
# reuse is shared enum types and YAML anchors, merged with `<<:`, defined
# where first used):
#   flux item  = title, description, flux_id              (&flux_item)
#                Scene, Use case, Issue
#   plan item  = flux item + status (Flux list group)    (&plan_item)
#                Scene, Use case; Issue has Flux's stage instead
#   child link = in_<parent>, at most one parent, inverse <children>
#                (a naming convention; no rela construct to share)
#   outside ref = the field that names the item in its outside system:
#                flux_id (Scene, Use case, Issue), url (Pull request)
#
# A concept is an association, never a base type or a property prefix: a kind
# has the concept when it is in the association's `from` (Melle, UC-Atlas-32).
# The link has no attributes; the fact that sets it carries when, by whom and
# why, and Facts answers the link with that fact.
#   completable = accepted_by (Scene, Use case) to a person; an issue is
#                 completed when its pull request is merged (IS-Atlas-63)

version: "1.0"
namespace: "https://eyra.co/ontology/atlas#"
description: |
  The product plan of Atlas: scenes, their use cases, their issues and the
  pull requests of those issues, and the people who accept them.

types:
  # Flux files scenes and use cases in a group of its Product list; no group
  # is "none". No transitions: Flux allows any move, and a sync must follow it.
  plan_status:
    values: [refine, ready_to_pick_up]
    labels:
      refine: Refine
      ready_to_pick_up: Ready to pick up
    descriptions:
      refine: Being written and negotiated; not ready to build from.
      ready_to_pick_up: Agreed; the next level can be derived and built.

  # A turn runs until it ends; an ended turn never runs again (a new turn is a new fact).
  turn_state:
    values: [running, ended]
    labels:
      running: Running
      ended: Ended

  # Flux's issue stages. Done is not a stage: an issue is completed when its
  # pull request is merged (IS-Atlas-63).
  issue_stage:
    values: [specification, design, development]
    labels:
      specification: Specification
      design: Design
      development: Development

  # GitHub's pull request states (gh: state). A draft is an open pull
  # request, so draft is a separate flag, as in GitHub (gh: isDraft).
  pull_request_state:
    values: [open, closed, merged]
    labels:
      open: Open
      closed: Closed
      merged: Merged

  github_pull_url:
    description: The web address of a GitHub pull request
    validations:
      - pattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[0-9]+$'
        error: "Must be a GitHub pull request URL, e.g. https://github.com/eyra/atlas/pull/12"

  # What became of a request to the agent (UC-Atlas-19).
  agent_outcome:
    values: [proposed, running, done, done_without_asking, stopped, refused, cancelled, failed]
    labels:
      proposed: Proposed
      running: Running
      done: Done
      done_without_asking: Done without asking
      stopped: Stopped
      refused: Refused
      cancelled: Cancelled
      failed: Failed

  # What became of one step of the agent's plan.
  agent_step_state:
    values: [stored, refused, dropped, not_run]
    labels:
      stored: Stored
      refused: Refused
      dropped: Dropped
      not_run: Not run

entities:
  scene:
    label: Scene
    plural: scenes
    aliases: [sc]
    id_type: manual
    id_prefix: "SC-"
    description: |
      An actor-centred view of the system, with one angle and one zoom level
      (Flux's meaning). The id is its code, e.g. SC-Atlas-01.
    properties: &plan_item
      <<: &flux_item
        title: { type: string, required: true, description: "Without the code (Flux: name)" }
        description: { type: string, description: "The text (Flux: description)" }
        flux_id: { type: string, unique: true, description: "Flux (Basecamp) id, set by a later Flux sync" }
      status: { type: plan_status, description: "Flux group; empty = no group" }

  use_case:
    label: Use case
    plural: use_cases
    aliases: [uc]
    id_type: manual
    id_prefix: "UC-"
    description: |
      The technical contract for part of a scene (Flux's meaning). The id is
      its code, e.g. UC-Atlas-01.
    properties:
      <<: *plan_item

  issue:
    label: Issue
    plural: issues
    aliases: [is]
    id_type: manual
    id_prefix: "IS-"
    description: |
      Small, independently testable work, normally one pull request (Flux's
      meaning). The id is its Atlas code, e.g. IS-Atlas-01.
    properties:
      <<: *flux_item
      stage: { type: issue_stage, description: "Flux: stage" }
      flux_ref: { type: string, unique: true, description: "Flux's own issue code (ref), e.g. NEXT-240, set by a later Flux sync" }

  pull_request:
    label: Pull request
    plural: pull_requests
    aliases: [pr]
    id_type: manual
    id_prefix: "PR-"
    description: |
      A GitHub pull request for an issue. Linked by URL; a GitHub connector
      fills title and state later. The id is derived from the URL,
      PR-<owner>-<repo>-<number>, so linking the same URL twice is one record.
    properties:
      url: { type: github_pull_url, required: true, unique: true, description: "GitHub: url" }
      title: { type: string, description: "GitHub: title" }
      state: { type: pull_request_state, description: "GitHub: state" }
      draft: { type: boolean, default: false, description: "GitHub: isDraft" }

  # Who can accept (and, with IS-Atlas-52, be assigned): a person. Not part of
  # the plan; reached through what points at it.
  person:
    label: Person
    plural: people
    id_type: manual
    description: |
      Someone who works with Atlas. The id is short and lower case, made from
      the name, e.g. melle.
    properties:
      name: { type: string, required: true, description: "As it is shown" }

  agent_request:
    label: Agent request
    plural: agent_requests
    aliases: [rq]
    id_type: manual
    id_prefix: "RQ-"
    description: |
      What Melle asked the agent on a page of the TUI (`:`), and what became of
      it: the plan's summary and its outcome. Its steps hang under it. The cause
      of every change the agent made (SC-Atlas-04, UC-Atlas-19).
    properties:
      title: { type: string, required: true, description: "The request, in Melle's words" }
      page: { type: string, description: "The page it was asked on" }
      planner: { type: string, description: "Who planned it" }
      outcome: { type: agent_outcome, description: "What became of it" }
      summary: { type: string, description: "What the agent said about its plan" }
      before: { type: string, description: "What became of the previous plan, after a refusal" }
      overrules: { type: string, description: "The request this one overrules (d-0016)" }

  agent_step:
    label: Agent step
    plural: agent_steps
    aliases: [st]
    id_type: manual
    id_prefix: "ST-"
    description: |
      One step of a request's plan: the form it filled, with what values, and
      what became of it, with the key of the item it made, changed or deleted.
    properties:
      title: { type: string, required: true, description: "The title of the form it filled" }
      n: { type: integer, description: "Its number in the plan" }
      tool: { type: string, description: "put, set or delete" }
      state: { type: agent_step_state, description: "What became of it" }
      detail: { type: string, description: "The id it stored, or why it was refused" }
      made: { type: string, description: "The key of the item it made, changed or deleted" }
      values: { type: string, description: "The values it gave, as JSON" }
      was: { type: string, description: "For a change: the values it replaced, as JSON" }

  # Who may own a fact, besides a person: an agent (the coordinator for now). Agents and
  # roles come with Organisation (SC-Atlas-02). Not part of the plan; reached through
  # what points at it, as a person is.
  agent:
    label: Agent
    plural: agents
    id_type: manual
    description: |
      An agent that works with Atlas. The id is short and lower case, made from the
      name, e.g. coordinator.
    properties:
      name: { type: string, required: true, description: "As it is shown" }
      cannot_run: { type: string, description: "Where and since when it cannot run, and why (3 crashes in 10 minutes); Runtime writes and clears it (IS-Atlas-18)" }

  # What belongs to being assigned, for one fact (d-0022, IS-Atlas-78): who it is assigned
  # to (assigned_to) and what they are expected to do (expected); later deadlines and the
  # flow state. Its id is made from the fact's: AS-<key>.
  assignment:
    label: Assignment
    plural: assignments
    id_type: manual
    id_prefix: "AS-"
    description: |
      What belongs to being assigned, for one fact: who it is assigned to and what
      they are expected to do. Made and deleted with the fact; its id is AS- and the
      fact's, e.g. AS-UC-Atlas-01.
    properties:
      of: { type: string, required: true, description: "The key of the fact it belongs to" }
      expected: { type: string, description: "What its owner is expected to do next; Flow writes it (IS-Atlas-53)" }
      deadline: { type: datetime, description: "When it should be done by; optional, it only marks it late (IS-Atlas-14)" }
      handover: { type: string, description: "A deferred automatic handover; Flow keeps it until the running owner ends its turn" }
      flow_state: { type: string, description: "The state of its flow it is in; Flow writes it (IS-Atlas-54)" }

  # One stretch in which an agent acts on one item (architecture v4, section 3, W1 to W4):
  # Runtime starts it for the item's owner, keeps its lease while the agent shows activity,
  # and ends it (IS-Atlas-15). Each start, renewal and end is a fact with its cause.
  turn:
    label: Turn
    plural: turns
    id_type: manual
    id_prefix: "TU-"
    description: |
      One stretch in which an agent acts on one item: started by Runtime for the item's
      owner, kept while the agent shows activity (its lease), ended when the agent ends
      it, goes silent, crashes, runs too long, or no longer owns the item.
    properties:
      state: { type: turn_state, required: true, description: "Running or ended" }
      machine: { type: string, required: true, description: "The machine whose Runtime runs it" }
      lease_until: { type: datetime, description: "Until when the turn holds its lease: the agent's last activity plus the silence limit" }
      activity: { type: string, description: "The agent's last activity Runtime saw" }
      why: { type: string, description: "Why it ended" }
      ended_at: { type: datetime, description: "When it ended" }
      outcome: { type: string, description: "The agent's fact about what it did; Runtime reads it and ends the turn" }

  flow_run:
    label: Flow run
    plural: flow_runs
    id_type: manual
    description: Durable generated state machine cursor, written only by its runner.
    properties:
      flow:
        type: string
      subject_kind:
        type: string
      subject_key:
        type: string
      generation:
        type: integer
      definition_sha256:
        type: string
      state:
        type: string
      entry:
        type: integer
      entered_at:
        type: string
      status:
        type: string
      deadlines:
        type: string
      pending:
        type: string
      input_cursor:
        type: integer
      last_input:
        type: string
      blocked_reason:
        type: string

relations:
  in_scene:
    label: in scene
    description: A use case belongs to at most one scene (Flux); a scene has zero or more use cases.
    from: [use_case]
    to: [scene]
    max_outgoing: 1
    inverse: { id: use_cases, label: use cases }

  in_use_case:
    label: in use case
    description: An issue belongs to at most one use case (Flux); a use case has zero or more issues.
    from: [issue]
    to: [use_case]
    max_outgoing: 1
    inverse: { id: issues, label: issues }

  in_issue:
    label: in issue
    description: A pull request belongs to at most one issue; an issue has zero or more pull requests.
    from: [pull_request]
    to: [issue]
    max_outgoing: 1
    inverse: { id: pull_requests, label: pull requests }

  # Completable (UC-Atlas-32): a scene or use case is completed when a person
  # accepts it, after testing. Only a person can be linked, so an agent never
  # accepts. Reopening removes the link; both are facts with their cause.
  accepted_by:
    label: accepted by
    description: Who accepted a scene or use case, after testing it; at most one.
    from: [scene, use_case]
    to: [person]
    max_outgoing: 1
    inverse: { id: accepted, label: accepted }

  # History only: issues done in another issue's pull request before each issue
  # had its own (PR #1, #2, #14). Set by the UC-Atlas-32 migration, never by
  # hand; going forward an issue gets its own pull request (UC-Atlas-31).
  done_in:
    label: also done in
    description: A merged pull request of another issue that also did this one.
    from: [issue]
    to: [pull_request]
    inverse: { id: also_done, label: also done }

  in_request:
    label: in request
    description: A step belongs to the request whose plan it was part of.
    from: [agent_step]
    to: [agent_request]
    max_outgoing: 1
    inverse: { id: steps, label: steps }

  # The owner (IS-Atlas-52, UC-Atlas-27): whoever is next in line to do something with a
  # fact, one, always. It is part of the fact's Assignment (IS-Atlas-78). The link has no
  # attributes: when, by whom and why are the fact that set it.
  assigned_to:
    label: assigned to
    description: Who is next in line to do something with it; one, a person or an agent.
    from: [assignment]
    to: [person, agent]
    max_outgoing: 1
    inverse: { id: assignments, label: assignments }

  # Every assignable thing has an Assignment (d-0022, IS-Atlas-78): a kind is assignable
  # when it is in this association's `from`. One each way; made and deleted with the
  # fact (rela/atlas.json marks it a component).
  assignment:
    label: assignment
    description: What belongs to being assigned, for one fact; made and deleted with it.
    from: [scene, use_case, issue, pull_request]
    to: [assignment]
    max_outgoing: 1
    inverse: { id: assignment_of, label: assignment of }

  # A turn is on one item (its Assignment) and by one agent (IS-Atlas-15).
  turn_on:
    label: on
    description: The item the turn acts on.
    from: [turn]
    to: [assignment]
    max_outgoing: 1
    inverse: { id: turns, label: turns }

  turn_by:
    label: by
    description: The agent that acts in the turn.
    from: [turn]
    to: [agent]
    max_outgoing: 1
    inverse: { id: turns_by, label: turns }
