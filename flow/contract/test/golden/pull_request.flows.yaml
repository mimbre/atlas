# Software: pull request. Starts when State records the PR that the
# Issue's publish effect created. Creates its linked review and test subjects
# (downward link, native). Their outcomes come back as review_outcome and
# test_outcome (upward link, Atlas layer).
flows:
  pull_request:
    label: Pull request
    subject: pull_request
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: checking
    states:
      checking:
        label: Review and test
        outputs:
          - set: { properties: { review_outcome: none, test_outcome: none, update: none } }
          - create:
              type: pr_review
              properties: { title: "Review of {{subject.id}}" }
              relate: { type: review_of }
          - create:
              type: pr_test
              properties: { title: "Test of {{subject.id}}" }
              relate: { type: test_of }
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.review_outcome == 'changes_requested'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.test_outcome == 'failed'" }
            - { to: integrating, roles: [atlas-flow], when: "entity.review_outcome == 'approved' and entity.test_outcome == 'passed'" }
      changes_requested:
        label: Changes requested
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: checking, roles: [atlas-flow], when: "entity.update == 'updated'" }
      integrating:
        label: Integrate
        outputs:
          - set: { properties: { integration: none } }
        on:
          change:
            - { to: integrated, roles: [atlas-flow], when: "entity.integration == 'done'" }
            - { to: blocked, roles: [atlas-flow], when: "entity.integration == 'refused'" }
        after:
          no_effect: { period: 1h, to: blocked, label: Code did not answer within an hour }
      blocked:
        label: Integration needs a person
        status: input_required
        waiting_for: [maintainer]
        on:
          change:
            - { to: integrating, roles: [maintainer], when: "entity.integration == 'retry'" }
            - { to: closed, roles: [maintainer], when: "entity.state == 'closed'" }
      integrated:
        label: Integrated
        final: true
      closed:
        label: Closed
        final: true
        status: cancelled
