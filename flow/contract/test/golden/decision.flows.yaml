# Status bridge: Facts authorizes status; Flow only observes it.
flows:
  decide:
    label: Decide
    subject: decision
    per_subject: one
    start:
      - on: create
    initial: proposed
    states:
      proposed:
        label: Proposed
        on:
          change:
            - { to: accepted, when: "entity.status == 'accepted'" }
            - { to: rejected, when: "entity.status == 'rejected'" }
      accepted:
        label: Accepted
        final: true
      rejected:
        label: Rejected
        final: true
