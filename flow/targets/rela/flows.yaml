# Generated by atlas (mix atlas.flow.gen) from flow/contract/lib/software.ex, flow/contract/lib/issue.ex, flow/contract/lib/pull_request.ex, flow/contract/lib/pr_review.ex, flow/contract/lib/pr_test.ex, flow/contract/lib/use_case.ex, flow/contract/lib/scene.ex, flow/contract/lib/decision.ex. Do not edit: change the contract and regenerate.
flows:
  issue:
    label: Issue
    subject: issue
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.stage == 'development'"
    initial: author
    states:
      author:
        label: Author pass
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: delivery_gate, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.pass_result == 'failed'" }
        after:
          runtime_wait: { period: 2d, to: needs_person, label: The owner's Runtime did not finish the pass }
      delivery_gate:
        label: Delivery-evidence gate
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: review, roles: [atlas-flow], when: "entity.gate_result == 'review'" }
            - { to: rework, roles: [atlas-flow], when: "entity.gate_result == 'rework'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.gate_result == 'person'" }
        after:
          no_decision: { period: 1h, to: needs_person, label: No gate decision within an hour }
      review:
        label: Review pass
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: review_gate, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.pass_result == 'failed'" }
        after:
          runtime_wait: { period: 2d, to: needs_person, label: The owner's Runtime did not finish the review }
      review_gate:
        label: Review gate
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: publish, roles: [atlas-flow], when: "entity.gate_result == 'ready'" }
            - { to: rework, roles: [atlas-flow], when: "entity.gate_result == 'rework'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.gate_result == 'person'" }
        after:
          no_decision: { period: 1h, to: needs_person, label: No gate decision within an hour }
      rework:
        label: Rework pass
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: delivery_gate, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.pass_result == 'failed'" }
        after:
          runtime_wait: { period: 2d, to: needs_person, label: The owner's Runtime did not finish the rework }
      publish:
        label: Create or update the PR
        outputs:
          - set: { properties: { effect_result: none } }
        on:
          change:
            - { to: in_pr, roles: [atlas-flow], when: "entity.effect_result == 'done'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.effect_result == 'refused'" }
        after:
          no_effect: { period: 1h, to: needs_person, label: Code did not answer within an hour }
      in_pr:
        label: In pull request
        on:
          change:
            - { to: rework, roles: [atlas-flow], when: "entity.pr_outcome == 'changes_requested'" }
            - { to: done, roles: [atlas-flow], when: "entity.pr_outcome == 'integrated'" }
            - { to: closed, roles: [atlas-flow], when: "entity.pr_outcome == 'closed'" }
      needs_person:
        label: A person decides
        status: input_required
        waiting_for: [maintainer]
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: review, roles: [maintainer], when: "entity.gate_result == 'review'" }
            - { to: rework, roles: [maintainer], when: "entity.gate_result == 'rework'" }
            - { to: publish, roles: [maintainer], when: "entity.gate_result == 'ready'" }
            - { to: closed, roles: [maintainer], when: "entity.gate_result == 'close'" }
      done:
        label: Integrated
        final: true
      closed:
        label: Closed
        final: true
        status: cancelled
  pull_request:
    label: Pull request
    subject: pull_request
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: checking
    states:
      checking:
        label: Review and test
        outputs:
          - set: { properties: { review_outcome: none, test_outcome: none, update: none } }
          - create:
              type: pr_review
              properties: { title: "Review of {{subject.id}}" }
              relate: { type: review_of }
          - create:
              type: pr_test
              properties: { title: "Test of {{subject.id}}" }
              relate: { type: test_of }
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.review_outcome == 'changes_requested'" }
            - { to: changes_requested, roles: [atlas-flow], when: "entity.test_outcome == 'failed'" }
            - { to: integrating, roles: [atlas-flow], when: "entity.review_outcome == 'approved' and entity.test_outcome == 'passed'" }
      changes_requested:
        label: Changes requested
        on:
          change:
            - { to: closed, when: "entity.state == 'closed'" }
            - { to: checking, roles: [atlas-flow], when: "entity.update == 'updated'" }
      integrating:
        label: Integrate
        outputs:
          - set: { properties: { integration: none } }
        on:
          change:
            - { to: integrated, roles: [atlas-flow], when: "entity.integration == 'done'" }
            - { to: blocked, roles: [atlas-flow], when: "entity.integration == 'refused'" }
        after:
          no_effect: { period: 1h, to: blocked, label: Code did not answer within an hour }
      blocked:
        label: Integration needs a person
        status: input_required
        waiting_for: [maintainer]
        on:
          change:
            - { to: integrating, roles: [maintainer], when: "entity.integration == 'retry'" }
            - { to: closed, roles: [maintainer], when: "entity.state == 'closed'" }
      integrated:
        label: Integrated
        final: true
      closed:
        label: Closed
        final: true
        status: cancelled
  pr_review:
    label: PR review
    subject: pr_review
    per_subject: one
    start:
      - on: create
    initial: working
    states:
      working:
        label: PR review in progress
        waiting_for: [reviewer]
        on:
          change:
            - { to: superseded, roles: [atlas-flow], when: "entity.superseded == true" }
            - { to: approved, roles: [reviewer], when: "entity.verdict == 'approved'" }
            - { to: changes_requested, roles: [reviewer], when: "entity.verdict == 'changes_requested'" }
        after:
          stalled: { period: 3d, to: escalated, label: No outcome in three days }
      escalated:
        label: Escalated
        status: input_required
        waiting_for: [maintainer, reviewer]
        on:
          change:
            - { to: superseded, roles: [atlas-flow], when: "entity.superseded == true" }
            - { to: approved, roles: [maintainer, reviewer], when: "entity.verdict == 'approved'" }
            - { to: changes_requested, roles: [maintainer, reviewer], when: "entity.verdict == 'changes_requested'" }
      approved:
        final: true
      changes_requested:
        final: true
      superseded:
        label: Superseded by a newer PR revision
        final: true
        status: cancelled
  pr_test:
    label: PR test
    subject: pr_test
    per_subject: one
    start:
      - on: create
    initial: working
    states:
      working:
        label: PR test in progress
        waiting_for: [tester]
        on:
          change:
            - { to: superseded, roles: [atlas-flow], when: "entity.superseded == true" }
            - { to: passed, roles: [tester], when: "entity.verdict == 'passed'" }
            - { to: failed, roles: [tester], when: "entity.verdict == 'failed'" }
        after:
          stalled: { period: 3d, to: escalated, label: No outcome in three days }
      escalated:
        label: Escalated
        status: input_required
        waiting_for: [maintainer, tester]
        on:
          change:
            - { to: superseded, roles: [atlas-flow], when: "entity.superseded == true" }
            - { to: passed, roles: [maintainer, tester], when: "entity.verdict == 'passed'" }
            - { to: failed, roles: [maintainer, tester], when: "entity.verdict == 'failed'" }
      passed:
        final: true
      failed:
        final: true
      superseded:
        label: Superseded by a newer PR revision
        final: true
        status: cancelled
  design_and_accept:
    label: Design and accept
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: designing
    states:
      designing:
        label: Design pass
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: design_review, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.pass_result == 'failed'" }
        after:
          runtime_wait: { period: 2d, to: needs_person, label: The owner's Runtime did not finish the pass }
      design_review:
        label: Design review pass
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: design_gate, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.pass_result == 'failed'" }
        after:
          runtime_wait: { period: 2d, to: needs_person, label: The owner's Runtime did not finish the review }
      design_gate:
        label: Design gate
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: to_accept, roles: [atlas-flow], when: "entity.gate_result == 'ready'" }
            - { to: redesign, roles: [atlas-flow], when: "entity.gate_result == 'rework'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.gate_result == 'person'" }
        after:
          no_decision: { period: 1h, to: needs_person, label: No gate decision within an hour }
      redesign:
        label: Design rework pass
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: design_review, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: needs_person, roles: [atlas-flow], when: "entity.pass_result == 'failed'" }
        after:
          runtime_wait: { period: 2d, to: needs_person, label: The owner's Runtime did not finish the rework }
      to_accept:
        label: Accept the design
        status: input_required
        waiting_for: [acceptor]
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, roles: [acceptor], when: "entity.verdict == 'accept'" }
            - { to: redesign, roles: [acceptor], when: "entity.verdict == 'reject'" }
      needs_person:
        label: A person decides
        status: input_required
        waiting_for: [maintainer]
        outputs:
          - set: { properties: { gate_result: none } }
        on:
          change:
            - { to: design_review, roles: [maintainer], when: "entity.gate_result == 'review'" }
            - { to: redesign, roles: [maintainer], when: "entity.gate_result == 'rework'" }
            - { to: to_accept, roles: [maintainer], when: "entity.gate_result == 'ready'" }
            - { to: dropped, roles: [maintainer], when: "entity.gate_result == 'close'" }
      accepted:
        label: Design accepted
        final: true
        outputs:
          - set: { properties: { design_status: accepted } }
      dropped:
        label: Dropped
        final: true
        status: cancelled
  test_and_accept_use_case:
    label: Build, test and accept
    subject: use_case
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: predicate
        when: "entity.design_status == 'accepted'"
    initial: break_down
    states:
      break_down:
        label: Break it down into issues
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.children > 0" }
      building:
        label: Build it
        on:
          change:
            - { to: break_down, roles: [atlas-flow], when: "entity.children == 0" }
            - { to: to_test, roles: [atlas-flow], when: "entity.open_children == 0" }
      to_test:
        label: Test it
        status: input_required
        waiting_for: [acceptor]
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, roles: [acceptor], when: "entity.verdict == 'accept'" }
            - { to: rework, roles: [acceptor], when: "entity.verdict == 'reject'" }
      rework:
        label: Rework it
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
            - { to: to_test, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: to_test, roles: [atlas-flow], label: Rework failed; the acceptor decides, when: "entity.pass_result == 'failed'" }
      accepted:
        label: Accepted
        final: true
  test_and_accept_scene:
    label: Build, test and accept
    subject: scene
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: break_down
    states:
      break_down:
        label: Break it down into use cases
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.children > 0" }
      building:
        label: Build it
        on:
          change:
            - { to: break_down, roles: [atlas-flow], when: "entity.children == 0" }
            - { to: to_test, roles: [atlas-flow], when: "entity.open_children == 0" }
      to_test:
        label: Test it
        status: input_required
        waiting_for: [acceptor]
        outputs:
          - set: { properties: { verdict: none } }
        on:
          change:
            - { to: accepted, roles: [acceptor], when: "entity.verdict == 'accept'" }
            - { to: rework, roles: [acceptor], when: "entity.verdict == 'reject'" }
      rework:
        label: Rework it
        outputs:
          - set: { properties: { pass_result: none } }
        on:
          change:
            - { to: building, roles: [atlas-flow], when: "entity.open_children > 0" }
            - { to: to_test, roles: [atlas-flow], when: "entity.pass_result == 'delivered'" }
            - { to: to_test, roles: [atlas-flow], label: Rework failed; the acceptor decides, when: "entity.pass_result == 'failed'" }
      accepted:
        label: Accepted
        final: true
  decide:
    label: Decide
    subject: decision
    run_as: system:sf-flow
    per_subject: one
    start:
      - on: create
    initial: proposed
    states:
      proposed:
        label: Proposed
        status: input_required
        waiting_for: [decider]
        outputs:
          - set: { properties: { status: proposed, verdict: none } }
        on:
          change:
            - { to: accepted, roles: [principle_authority], when: "entity.verdict == 'accept' and entity.force == 'principle'" }
            - { to: accepted, roles: [decider], when: "entity.verdict == 'accept' and entity.force ~= 'principle'" }
            - { to: accepted, roles: [delegate], when: "entity.verdict == 'accept' and entity.force ~= 'principle' and entity.reversibility == 'two_way' and entity.category ~= 'product' and entity.category ~= 'security'" }
            - { to: rejected, roles: [decider, principle_authority], when: "entity.verdict == 'reject'" }
            - { to: rejected, roles: [delegate], when: "entity.verdict == 'reject' and entity.reversibility == 'two_way' and entity.category ~= 'product' and entity.category ~= 'security'" }
      accepted:
        label: Accepted
        final: true
        outputs:
          - set: { properties: { status: accepted } }
      rejected:
        label: Rejected
        final: true
        outputs:
          - set: { properties: { status: rejected } }
